  :root {
    --bg: oklch(0.14 0.01 255);
    --surface: oklch(0.19 0.012 255);
    --line: oklch(0.34 0.015 255);
    --edge: oklch(0.42 0.015 255);
    --ink: oklch(0.95 0.005 255);
    --muted: oklch(0.72 0.012 255);
    --faint: oklch(0.55 0.012 255);
    --node-ink: oklch(0.17 0.01 255);   /* letters on colored fills — neutral, never a hue */

    --done: oklch(0.78 0.15 155);
    --running: oklch(0.86 0.18 225);
    --running-core: oklch(0.995 0.03 210);
    --beat: 1.5s;
    --shine: conic-gradient(from 0deg,
      oklch(0.22 0.008 255) 0%,
      oklch(0.22 0.008 255) 25%,
      oklch(0.78 0.01 255) 25%,
      oklch(0.78 0.01 255) 35%,
      oklch(0.58 0.12 250) 35%,
      oklch(0.58 0.12 250) 45%,
      oklch(0.99 0 0) 45%,
      oklch(0.99 0 0) 100%);
    --issues: oklch(0.83 0.13 90);
    --error: oklch(0.7 0.17 25);
    --pending: oklch(0.42 0.012 255);
    --node-fill: var(--pending);
  }

  * { margin: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Onest", system-ui, sans-serif;
    font-size: 14px; line-height: 1.4;
    padding: 18px 22px 40px;
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .top h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .top .stem { font-size: 13px; font-weight: 300; color: var(--ink); }
  .top .meta { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 300; color: var(--ink); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
  .live-dot.stale { background: var(--error); }

  /* ---------- board ---------- */
  .viewport { overflow: auto; }
  .board { position: relative; }
  .board > svg { position: absolute; inset: 0; overflow: visible; }

  /* ---------- several runs on one page ---------- */
  .run { margin-top: 26px; }
  .run-title {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px;
  }
  h2.run-title { font-size: 15px; }
  .run-title .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pending); flex: none; align-self: center; }
  .run-title .dot.s-done { background: var(--done); }
  .run-title .dot.s-running { background: var(--running); }
  .run-title .dot.s-issues { background: var(--issues); }
  .run-title .dot.s-error { background: var(--error); }
  .run-title .stem { font-size: 13px; font-weight: 300; color: var(--ink); }
  .run-title .run-stats { font-size: 12px; font-weight: 300; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- wave panels: the lanes of one wave sit on their own plate ---------- */
  .wave-panel { fill: color-mix(in oklch, var(--surface), transparent 22%); stroke: var(--line); stroke-width: 1.5; }
  .wave-tag {
    position: absolute; transform: translateX(-100%);
    pointer-events: none; white-space: nowrap;
    font-weight: 600; text-transform: uppercase;
  }

  /* version A — the plate carries the status colour, the label stays neutral ink */
  .panels-tint .wave-panel.s-done    { fill: color-mix(in oklch, var(--done), transparent 90%);    stroke: color-mix(in oklch, var(--done), transparent 74%); }
  .panels-tint .wave-panel.s-running { fill: color-mix(in oklch, var(--running), transparent 90%); stroke: color-mix(in oklch, var(--running), transparent 74%); }
  .panels-tint .wave-panel.s-issues  { fill: color-mix(in oklch, var(--issues), transparent 90%);  stroke: color-mix(in oklch, var(--issues), transparent 74%); }
  .panels-tint .wave-panel.s-error   { fill: color-mix(in oklch, var(--error), transparent 90%);   stroke: color-mix(in oklch, var(--error), transparent 74%); }
  .panels-tint .wave-tag { font-size: 23px; letter-spacing: 0.2em; color: var(--ink); }

  /* version B — every plate the same light grey, the wave label becomes the status button */
  .panels-chip .wave-panel {
    fill: color-mix(in oklch, oklch(0.72 0.012 255), transparent 89%);
    stroke: color-mix(in oklch, oklch(0.72 0.012 255), transparent 76%);
  }
  .panels-chip .wave-tag {
    font-size: 20px; letter-spacing: 0.16em;
    padding: 10px 22px; border-radius: 13px;
    color: var(--node-ink); background: var(--pending);
  }
  .panels-chip .wave-tag.s-done    { background: var(--done); }
  .panels-chip .wave-tag.s-running { background: var(--running); }
  .panels-chip .wave-tag.s-issues  { background: var(--issues); }
  .panels-chip .wave-tag.s-error   { background: var(--error); }

  /* the start signal — one lamp, green, like the light that drops for a race */
  .orch-light { position: absolute; transform: translate(-50%, -50%); }
  .orch-light svg { width: 100%; height: 100%; display: block; }
  .orch-light .lamp { filter: drop-shadow(0 0 7px color-mix(in oklch, var(--done), transparent 25%)); }

  .seg { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 300; color: var(--ink); }
  .seg + .seg { margin-left: 10px; }
  .seg > button {
    font: inherit; font-size: 12px; color: var(--ink);
    background: none; border: 1px solid transparent; padding: 2px 9px;
    border-radius: 999px; cursor: pointer; line-height: 1.5;
  }
  .seg > button:hover { border-color: var(--line); }
  .seg > button.on { background: var(--surface); border-color: var(--edge); font-weight: 500; }

  /* wave header — hub circle top-left, its shape and cost beside it */
  .wave-head {
    position: absolute; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    pointer-events: none; white-space: nowrap;
  }
  .wave-head .formula { font-size: 13px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .wave-head .head-stats { font-size: 12px; font-weight: 300; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mode {
    font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 2px 10px; border-radius: 99px;
    border: 1px solid var(--edge); background: var(--surface);
  }
  .mode .sym { font-size: 13px; letter-spacing: 0; line-height: 1; }
  .mode.is-seq { color: var(--ink); letter-spacing: 0.16em; }

  /* ---------- nodes ---------- */
  .node { position: absolute; transform: translate(-50%, -50%); }
  .disc {
    position: absolute; inset: 0; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--pending); color: var(--node-ink);
    font-weight: 700;
  }
  .s-done    { --node-fill: var(--done); }
  .s-done    .disc { background: var(--done); }
  .s-running .disc {
    background: radial-gradient(circle at 50% 42%,
      oklch(1 0.02 210) 0%,
      var(--running-core) 22%,
      oklch(0.9 0.16 220) 48%,
      var(--running) 72%,
      oklch(0.7 0.24 245) 100%);
    box-shadow:
      0 0 4px oklch(1 0.06 210 / 0.9),
      0 0 12px oklch(0.95 0.16 215 / 0.7),
      0 0 22px oklch(0.78 0.26 235 / 0.45);
  }
  .s-running .disc::before {
    content: "";
    position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(circle at 50% 40%,
      oklch(0.92 0.28 195 / 0.7) 0%,
      oklch(0.82 0.26 220 / 0.45) 38%,
      oklch(0.6 0.05 245 / 0.28) 62%,
      transparent 78%);
    opacity: 0.45;
  }
  .s-running { --node-fill: var(--running); }
  .s-issues  { --node-fill: var(--issues); }

  /* in-progress border — clockwise with the gear, no pulse */

    0%, 45%, 100% { opacity: 0.16; filter: blur(8px) brightness(0.7); }
    10%           { opacity: 1;    filter: blur(20px) brightness(1.85); }
    18%           { opacity: 0.2;  filter: blur(8px) brightness(0.75); }
    28%           { opacity: 0.78; filter: blur(16px) brightness(1.45); }
  }
  @keyframes shine-beat {
    0%, 45%, 100% { opacity: 0.42; }
    10%           { opacity: 1; }
    18%           { opacity: 0.48; }
    28%           { opacity: 0.88; }
  }
  @keyframes core-beat {
    0%, 45%, 100% {
      box-shadow:
        inset 0 0 10px oklch(0.85 0.22 195 / 0.28),
        0 0 3px oklch(1 0.05 210 / 0.45),

        0 0 22px oklch(0.95 0.18 215 / 0.95),

        0 0 18px oklch(0.92 0.16 215 / 0.75),
        0 0 32px oklch(0.8 0.26 230 / 0.55);
    }
  }
  @keyframes core-flare {
    0%, 45%, 100% { opacity: 0.1; }
    10%           { opacity: 1; }
    18%           { opacity: 0.12; }
    28%           { opacity: 0.7; }

  .ringx, .bloom {

    animation: spin 16s linear infinite;

  }

    animation: spin 16s linear infinite;
    filter: blur(8px);
    opacity: 0;

    animation: spin 16s linear infinite, shine-beat var(--beat) linear infinite;

    animation: spin 16s linear infinite, heartbeat var(--beat) linear infinite;

    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));

  .node-label {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);

    display: block; margin-top: 2px;
    font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums;

     how its wave's gate ruled. Clamped so a long title cannot widen the plate;
     the node's title attribute still holds the whole string. */
  .node-label.terse { max-width: 168px; overflow: hidden; text-overflow: ellipsis; }

  .row { position: absolute; display: flex; align-items: center; gap: 8px; transform: translateY(-50%); white-space: nowrap; }
  .row .node { position: relative; transform: none; flex: none; }
  .row .name { font-size: 13px; font-weight: 500; }

  .row .rmeta { font-size: 11.5px; font-weight: 400; color: var(--ink); opacity: 0.72; font-variant-numeric: tabular-nums; flex: none; }
  .row .name { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }

  .disc svg :is(path, rect, circle, ellipse):not([fill="none"]):not(.file-sheet):not(.ext-badge) { fill: currentColor; }
  .disc svg.agent-ic { width: 99%; height: 99%; }
  .s-running .disc .mech-frame { transform-box: view-box; transform-origin: center; animation: skillspin 16s linear infinite; }
  .s-running .disc .mech-frame .ring { stroke-dasharray: 1.9 0.69; }
  @keyframes skillspin { to { transform: rotate(360deg); } }
  .disc svg.ag { width: 99%; height: 99%; }

  /* document paper — status fill on the sheet; circular mech-frame matches skill/tool */
  .disc svg .file-sheet {
    fill: var(--node-fill) !important;
    stroke: #000;
  }
  .disc svg .file-fold { fill: var(--node-ink); stroke: #000; }

  .finding { position: absolute; transform: translateY(-50%); font-size: 11.5px; font-weight: 400; color: var(--ink); white-space: nowrap; max-width: 270px; overflow: hidden; text-overflow: ellipsis; }

  .finding.critical b,   .legend .sev.critical   { color: var(--error); }
  .finding.warning b,    .legend .sev.warning    { color: var(--issues); }
  .finding.suggestion b, .legend .sev.suggestion { color: var(--faint); }

  .finding:hover {

  .legend .sw { width: 11px; height: 11px; border-radius: 50%; }

  .legend .sev { font-size: 11.5px; font-weight: 600; width: 11px; text-align: center; }
  .legend .sw.shine {

    animation: spin 16s linear infinite, shine-beat var(--beat) linear infinite;
  }
  html.pulse-on .legend .sw.shine::after {
    animation: spin 16s linear infinite, heartbeat var(--beat) linear infinite;
  }

  .empty { margin: 90px auto; text-align: center; color: var(--ink); font-weight: 300; }

let RUNS_MODE = new URLSearchParams(location.search).get("runs");

document.addEventListener("click", (e) => {

  if (b.dataset.runs) {

function parseTokens(t) {
  if (t == null || t === "") return null;
  if (typeof t === "number" && Number.isFinite(t)) return t;
  if (typeof t === "string" && t.trim() && Number.isFinite(+t)) return +t;
  if (typeof t === "object") {
    if (Number.isFinite(t.total)) return t.total;
    const a = (t.input ?? t.in ?? 0) + (t.output ?? t.out ?? 0);
    return a ? a : null;
  }
  return null;
}

/* a lane's own total, else the sum of its agents' — never both (that double-counts) */
function laneTokens(l) {
  const direct = parseTokens(l.tokens);
  if (direct != null) return direct;
  let sum = 0, any = false;
  for (const a of (l.agents || [])) {
    const at = parseTokens(a.tokens);
    if (at != null) { sum += at; any = true; }
  }
  return any ? sum : null;
}

function waveTokens(w) {
  const direct = parseTokens(w.tokens);
  if (direct != null) return direct;
  let sum = 0, any = false;
  for (const l of (w.lanes || [])) {
    const lt = laneTokens(l);
    if (lt != null) { sum += lt; any = true; }
  }
  return any ? sum : null;
}

function fmtTokens(n) {
  if (n == null) return null;
  const abs = Math.abs(n);
  if (abs >= 1e6) return `${(n / 1e6).toFixed(abs >= 1e7 ? 0 : 1).replace(/\.0$/, "")}M tok`;
  if (abs >= 1000) return `${(n / 1000).toFixed(abs >= 10000 ? 0 : 1).replace(/\.0$/, "")}k tok`;
  return `${Math.round(n)} tok`;
}

/* wall-clock start, e.g. "12:00 PM" — shown under a wave's number */
function fmtClock(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  return new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function fmtDur(ms) {
  if (ms == null || ms < 0 || !Number.isFinite(ms)) return null;
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return r ? `${m}m ${r}s` : `${m}m`;
  const h = Math.floor(m / 60), m2 = m % 60;
  return m2 ? `${h}h ${m2}m` : `${h}h`;
}

function durationMs(started, ended, status) {
  if (!started) return null;
  const t0 = Date.parse(started);
  if (!Number.isFinite(t0)) return null;
  const t1 = ended ? Date.parse(ended) : (status === "running" ? Date.now() : NaN);
  if (!Number.isFinite(t1)) return null;
  return Math.max(0, t1 - t0);
}

/* ---------- active time ----------
   Wall clock answers "how long ago did this start", which is not the question
   the board is asked. A run left overnight came back reporting 12h 51m of work.
   Active time answers it from the one signal that only moves while work happens:
   the per-subagent spans the tracker hook stamps off each Task call. Overlapping
   lanes count once — two agents sharing the same 20 minutes is 20 minutes of
   work, not 40. Idle is whatever wall clock has left over, and it is never
   guessed at: with no agent stamped anywhere (an old board, or a run whose hook
   never fired) there is nothing to union, so wall clock stands in unchanged
   rather than reporting a confident zero. */

/* every agent under a run, a wave, or a single lane */
function agentsUnder(scope) {
  if (!scope || typeof scope !== "object") return [];
  const lanes = scope.waves ? (scope.waves || []).flatMap((w) => (w && w.lanes) || [])
    : scope.lanes ? scope.lanes || []
      : [scope];
  return lanes.flatMap((l) => ((l && l.agents) || []).filter((a) => a && typeof a === "object"));
}

function spanOf(agent, now) {
  const t0 = Date.parse((agent && agent.started) || "");
  if (!Number.isFinite(t0)) return null;
  const t1 = agent.ended ? Date.parse(agent.ended)
    : (st(agent.status) === "running" ? now : NaN);   /* a live agent is working right now */
  return Number.isFinite(t1) && t1 >= t0 ? [t0, t1] : null;
}

/* An open span is evidence only while the board is being written. A run whose
   orchestrator stopped writing at 01:31 and was found at 13:14 has one agent
   still saying `running`, and letting it tick to now rebuilds the very number
   this replaced — 19h of "active" work nobody did. So an open span reaches at
   most one staleness window past the last write: while the board is live that
   ceiling is in the future and changes nothing, and the moment the writer stops
   the clock stops with it. Set on every render, read by the 1s ticker. */
let SPAN_CEIL = Infinity;

function spanCeiling(data) {
  const seen = Date.parse((data && data.updated) || "");
  return Number.isFinite(seen) ? seen + STALE_AFTER_MS : Infinity;
}

function spanNow(now) {
  return Math.min(now == null ? Date.now() : now, SPAN_CEIL);
}

/* ---------- the activity trail ----------
   A span is when an agent was open; the trail is when anyone was working. They
   are not the same: a background agent left open overnight reported 12.7h on a
   one real lane while every other agent that day ran 4–13 minutes. The hook
   samples every tool call — including a subagent's own, which fire under the
   parent session — so the trail is dense while work happens and empty while it
   does not. Intersecting the two throws the night out of the middle of the span.
   No trail (older runs, or a run whose hook never fired) → no intersection, and
   spans stand as they did. */
let ACTIVITY = [];              /* merged [start, end] windows, epoch ms */

const IDLE_GAP_MS = 300000;     /* 5 min with no tool call at all = idle */
const SAMPLE_MS = 30000;        /* the hook's sampling interval — a sample covers it */

function activityWindows(samples) {
  /* > 0 drops the trailing blank line, which would otherwise coerce to a 1970 sample */
  const s = (samples || []).filter((t) => Number.isFinite(t) && t > 0).sort((a, b) => a - b);
  const out = [];
  for (const t of s) {
    const last = out[out.length - 1];
    if (last && t - last[1] <= IDLE_GAP_MS) last[1] = t + SAMPLE_MS;
    else out.push([t, t + SAMPLE_MS]);
  }
  return out;
}

/* |A ∩ B| for two sorted, already-merged interval sets */
function intersectMs(a, b) {
  let i = 0, j = 0, total = 0;
  while (i < a.length && j < b.length) {
    const lo = Math.max(a[i][0], b[j][0]), hi = Math.min(a[i][1], b[j][1]);
    if (hi > lo) total += hi - lo;
    if (a[i][1] < b[j][1]) i++; else j++;
  }
  return total;
}

function mergeSpans(spans) {
  const s = (spans || []).slice().sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const sp of s) {
    const last = out[out.length - 1];
    if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]);
    else out.push(sp.slice());
  }
  return out;
}

function spansUnder(scope, now) {
  return agentsUnder(scope).map((a) => spanOf(a, spanNow(now))).filter(Boolean);
}

function unionMs(spans) {
  if (!spans || !spans.length) return null;
  const merged = mergeSpans(spans);
  if (ACTIVITY.length) return intersectMs(merged, ACTIVITY);     /* spans ∩ work */
  return merged.reduce((n, s) => n + (s[1] - s[0]), 0);
}

/* the ticker re-reads spans off the DOM, so they travel as `t0,t1|t0,` epoch ms —
   an empty end means still running, and resolves against now on every tick */
function spansAttr(scope) {
  const spans = agentsUnder(scope).map((a) => {
    const t0 = Date.parse(a.started || "");
    if (!Number.isFinite(t0)) return null;
    if (a.ended) {
      const t1 = Date.parse(a.ended);
      return Number.isFinite(t1) && t1 >= t0 ? `${t0},${t1}` : null;
    }
    return st(a.status) === "running" ? `${t0},` : null;
  }).filter(Boolean);
  /* the run's ceiling rides along, so multi-run pages cap each board by its own
     last write rather than by whichever run was rendered last */
  return spans.length ? `${Number.isFinite(SPAN_CEIL) ? SPAN_CEIL : ""}|${spans.join("|")}` : "";
}

function parseSpans(attr, now) {
  const parts = String(attr || "").split("|");
  const ceil = +parts.shift();
  const cap = Math.min(now, Number.isFinite(ceil) ? ceil : Infinity);
  return parts.filter(Boolean).map((part) => {
    const [a, b] = part.split(",");
    const t0 = +a, t1 = b === "" || b == null ? cap : +b;
    return Number.isFinite(t0) && Number.isFinite(t1) && t1 >= t0 ? [t0, t1] : null;
  }).filter(Boolean);
}

/* hover carries what the terse line drops — the wall clock it replaced, and the
   idle it hides. Silent when nothing is stamped: then the line *is* wall clock. */
function statsTitle(started, ended, status, spans) {
  const act = unionMs(spans);
  if (act == null) return "";
  const parts = [`${fmtDur(act)} active`];
  const wall = durationMs(started, ended, status);
  if (wall != null) {
    parts.push(`${fmtDur(wall)} elapsed`);
    if (wall - act > 60000) parts.push(`${fmtDur(wall - act)} idle`);
  }
  return parts.join(" · ");
}

function statsLine(started, ended, tokens, status, spans) {
  const act = unionMs(spans);
  const d = fmtDur(act != null ? act : durationMs(started, ended, status));
  const tok = fmtTokens(typeof tokens === "number" || tokens == null ? tokens : parseTokens(tokens));
  if (d && tok) return `${d} · ${tok}`;
  if (d) return d;
  if (tok) return tok;
  return "—";
}

function isParallel(w) {
  const p = String(w.parallelism || "").toLowerCase();
  if (p === "parallel") return true;
  if (p === "sequential" || p === "seq") return false;
  return (w.lanes || []).length >= 2;
}

/* e.g. "A ‖ B → C" — ‖ inside a stage, → between them */
function laneFormula(w) {
  return laneStages(w)
    .map((stage) => stage.map((l) => l.lane || "?").join(" ‖ "))
    .join(" → ");
}

/* `label` is plain text, or {html, cls} when the caller needs its own markup
   inside the label (compact's id + title) — the html form is escaped by its
   builder, never by a caller passing raw board strings */
function circleNode(x, y, r, status, cls, label, title, letter, sub) {
  const s = st(status);
  const d = r * 2;
  const shine = s === "running";
  const labelHtml = !label ? "" : typeof label === "string" ? esc(label) : label.html;
  const labelCls = label && label.cls ? ` ${label.cls}` : "";
  /* a string sub is static text; an object sub is a live stats line the ticker owns */
  const subHtml = !sub ? ""
    : typeof sub === "string"
      ? `<span class="sub">${esc(sub)}</span>`
      : sub.text
        ? `<span class="sub stats" data-started="${esc(sub.started || "")}" data-ended="${esc(sub.ended || "")}"
             data-tokens="${sub.tokens == null ? "" : sub.tokens}" data-status="${esc(st(sub.status))}"
             data-spans="${esc(sub.spans || "")}" title="${esc(sub.title || "")}">${esc(sub.text)}</span>`
        : "";
  return `<div class="node ${cls} s-${s}${r <= R.agent ? " small" : ""}"
    style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;${letter ? `font-size:${Math.round(r * (String(letter).length > 1 ? 0.78 : 1.12))}px;` : ""}"
    title="${esc(title || "")}">
    ${shine ? '<div class="bloom"></div><div class="ringx"></div>' : ""}
    <div class="disc">${esc(letter || "")}</div>
    ${label ? `<div class="node-label${labelCls}">${labelHtml}${subHtml}</div>` : ""}
  </div>`;
}

function rowNode(x, y, r, status, name, kind, title, minor, meta) {
  const s = st(status);
  const d = r * 2;
  const shine = s === "running";
  return `<div class="row${minor ? " minor" : ""}" style="left:${x}px;top:${y}px" title="${esc(title || `${name} — ${kind}`)}">
    <div class="node s-${s} small" style="width:${d}px;height:${d}px">
      ${shine ? '<div class="bloom"></div><div class="ringx"></div>' : ""}
      <div class="disc">${ICONS[kind] || ""}</div>
    </div>
    <span class="name">${esc(name)}</span>
    ${meta && meta.text ? `<span class="rmeta stats" data-started="${esc(meta.started || "")}"
      data-ended="${esc(meta.ended || "")}" data-tokens="${meta.tokens == null ? "" : meta.tokens}"
      data-status="${esc(st(meta.status))}">${esc(meta.text)}</span>` : ""}
  </div>`;
}

function fileNode(x, y, status, name, title) {
  const s = st(status);
  const d = R.art * 2;
  return `<div class="row minor" style="left:${x}px;top:${y}px" title="${esc(title || name)}">
    <div class="node file s-${s} small" style="width:${d}px;height:${d}px">
      ${s === "running" ? '<div class="bloom"></div><div class="ringx"></div>' : ""}
      <div class="disc">${fileIcon(title || name)}</div>
    </div>
    <span class="name">${esc(name)}</span>
  </div>`;
}

function laneStats(lane) {
  const tok = laneTokens(lane);
  const spans = spansUnder(lane);
  const text = statsLine(lane.started, lane.ended, tok, lane.status, spans);
  return text === "—" ? null
    : { text, started: lane.started, ended: lane.ended, tokens: tok, status: lane.status,
        spans: spansAttr(lane), title: statsTitle(lane.started, lane.ended, lane.status, spans) };
}

/* compact's answer to "where is this run": the todo each lane is on, id first.
   A bare letter tells you a lane exists; it does not tell you what it is doing,
   which is the whole reason the glance view gets looked at. */
function laneTerseLabel(lane) {
  const todos = lane.todos || [];
  const first = todos[0] || {};
  const id = first.id ? String(first.id) : "";
  const title = first.title || lane.brief || "";
  if (!id && !title) return null;
  const more = todos.length > 1 ? ` +${todos.length - 1}` : "";
  return { cls: "terse", html: `${id ? `<span class="tid">${esc(id)}</span> ` : ""}${esc(title + more)}` };
}

/* height a lane occupies below its circle centre — drives the flow layout */
function laneExtras(lane) {
  if (VIEW === "compact") return R.lane + (laneTerseLabel(lane) ? 28 : 10);
  let h = R.lane + (laneStats(lane) ? 54 : 40);     /* circle + meta (+ stats) */
  if ((lane.todos || []).length) h += 30;
  for (const a of (lane.agents || [])) {
    h += 36;
    h += ((a.skills || []).length + (a.tools || []).length + (a.artifacts || []).length) * 30;
  }
  h += ((lane.findings || []).length) * 22;
  return h;
}

/* how far a lane's detail block reaches right of its circle */
function laneContentW(lane) {
  if (VIEW === "compact") return laneTerseLabel(lane) ? 96 : R.lane + 6;   /* label is centred, so half of it clears the circle */
  const hasRows = ((lane.agents || []).length + (lane.findings || []).length + (lane.todos || []).length) > 0;
  return hasRows ? 300 : 62;
}

/* lanes grouped into dependency stages — one stage = one set that runs together.
   `after: ["A","B"]` on a lane means it waits for those; with no deps declared
   the wave's own parallel/sequential shape decides. */
function laneStages(w) {
  const lanes = w.lanes || [];
  if (!lanes.length) return [];
  const byId = new Map(lanes.map((l) => [String(l.lane), l]));
  if (!lanes.some((l) => (l.after || []).length)) {
    return isParallel(w) ? [lanes] : lanes.map((l) => [l]);
  }
  const depth = new Map();
  const resolve = (l, seen) => {
    const id = String(l.lane);
    if (depth.has(id)) return depth.get(id);
    if (seen.has(id)) return 0;                     /* cycle guard */
    seen.add(id);
    const deps = (l.after || []).map((d) => byId.get(String(d))).filter(Boolean);
    const d = deps.length ? 1 + Math.max(...deps.map((p) => resolve(p, seen))) : 0;
    depth.set(id, d);
    return d;
  };
  lanes.forEach((l) => resolve(l, new Set()));
  const out = [];
  lanes.forEach((l) => {
    const d = depth.get(String(l.lane)) || 0;
    (out[d] = out[d] || []).push(l);
  });
  return out.filter(Boolean);
}

function pulseOn(data) {
  return PULSE_OVERRIDE == null ? (data || {}).pulse !== false : PULSE_OVERRIDE;
}

function applyPulse(data) {
  document.documentElement.classList.toggle("pulse-on", pulseOn(data));
}

/* builds one run's board; the callers below place it on the page */
function boardMarkup(data) {
  const compact = VIEW === "compact";
  const STAGE_W = compact ? STAGE_W_MINI : STAGE_W_FULL;
  const HEADER_H = compact ? 74 : HEADER_H_FULL;
  const waves = data.waves || [];
  let nodes = "", edges = "", axisLabels = "";
  const line = (x1, y1, x2, y2, arrow) =>
    edges += `<path d="M ${x1} ${y1} L ${x2} ${y2}" fill="none" stroke="var(--line)" stroke-width="1.5"${arrow ? ' marker-end="url(#ah)"' : ""}/>`;

  /* ---- plan the flow: hub → stage columns, every wave centred on one baseline ---- */
  const plan = waves.map((w) => {
    const stages = laneStages(w);
    const stageH = stages.map((stage) =>
      stage.reduce((h, l) => h + R.lane + laneExtras(l) + LANE_VGAP, 0) - LANE_VGAP);
    return { w, stages, stageH, extent: Math.max(R.lane * 2, ...stageH) };
  });

  const BASE_Y = 60 + HEADER_H + Math.max(R.lane * 2, ...plan.map((p) => p.extent)) / 2;

  let x = AX + 96;
  plan.forEach((p) => {
    p.hubX = x;
    p.stageX = p.stages.map((_, s) => x + HUB_GAP + s * STAGE_W);
    const lastX = p.stageX.length ? p.stageX[p.stageX.length - 1] : x;
    x = lastX + STAGE_W + WAVE_GAP;                 /* next hub */
    /* place every lane: column = stage, stack centred on the baseline */
    p.stages.forEach((stage, s) => {
      let yRel = -p.stageH[s] / 2;
      stage.forEach((lane) => {
        lane._x = p.stageX[s];
        lane._y = BASE_Y + yRel + R.lane;
        yRel += R.lane + laneExtras(lane) + LANE_VGAP;
      });
    });
  });

  /* connector: leaves a circle rightward, turns in the gutter before the target,
     enters it from the left — so it never cuts through a lane's detail block */
  const link = (x1, y1, r1, x2, y2, r2, strong) => {
    const sx = x1 + r1, ex = x2 - r2 - 7;
    const gx = Math.max(sx + 14, x2 - 60);
    let d;
    if (Math.abs(y2 - y1) < 1) {
      d = `M ${sx} ${y1} L ${ex} ${y2}`;
    } else {
      const dir = y2 > y1 ? 1 : -1;
      const c = Math.max(0, Math.min(14, Math.abs(y2 - y1) / 2, gx - sx, ex - gx));
      d = `M ${sx} ${y1} H ${gx - c} Q ${gx} ${y1} ${gx} ${y1 + dir * c}`
        + ` V ${y2 - dir * c} Q ${gx} ${y2} ${gx + c} ${y2} H ${ex}`;
    }
    edges += `<path d="${d}" fill="none" stroke="${strong ? "var(--ink)" : "var(--edge)"}"
      stroke-width="${strong ? 2 : 1.6}" marker-end="url(#${strong ? "ah2" : "ah"})"/>`;
  };

  /* wave plates — sized around the lanes, with a header band for the hub and label */
  let maxBottom = BASE_Y, panels = "";
  plan.forEach((p) => {
    const lanes = p.w.lanes || [];
    if (!lanes.length) return;
    let top = Infinity, bot = -Infinity, right = p.hubX + R.hub;
    lanes.forEach((l) => {
      top = Math.min(top, l._y - R.lane);
      bot = Math.max(bot, l._y + laneExtras(l));
      right = Math.max(right, l._x + laneContentW(l));
    });
    const x0 = p.hubX - R.hub - 24, y0 = top - HEADER_H, x1 = right + 26, y1 = bot + 24;
    p.x0 = x0; p.x1 = x1;                           /* plate edges — the gate is placed off them */
    p.hubY = y0 + 26 + R.hub;                       /* hub sits in the plate's top-left corner */
    panels += `<rect class="wave-panel s-${st(p.w.status)}" x="${x0}" y="${y0}"
      width="${x1 - x0}" height="${y1 - y0}" rx="34"/>`;
    if (!compact) {
      axisLabels += `<div class="wave-tag s-${st(p.w.status)}" style="left:${x1 - 24}px;top:${y0 + 20}px">wave ${esc(p.w.wave)}</div>`;
    }
    maxBottom = Math.max(maxBottom, y1);
  });

  /* the gate belongs to neither wave — it sits in the corridor between two plates,
     on the straight run of the arrow that hands the run forward. The last wave's
     gate clears the right edge of its plate the same way. */
  plan.forEach((p, i) => {
    const right = p.x1 == null ? p.hubX + R.hub : p.x1;
    const next = plan[i + 1];
    p.gateX = next && next.x0 != null ? (right + next.x0) / 2 : right + 26 + R.gate;
  });

  /* the start signal — one lamp, green: the light that drops to start the race */
  const START_Y = plan.length ? plan[0].hubY : BASE_Y;
  nodes += `<div class="node orch-light" style="left:${AX}px;top:${START_Y}px;width:32px;height:46px"
    title="mow go — the start signal">
    <svg viewBox="0 0 32 46" aria-hidden="true">
      <rect x="6.5" y="1" width="19" height="4" rx="2" fill="var(--edge)"/>
      <rect x="1.5" y="5" width="29" height="40" rx="9" fill="var(--surface)" stroke="var(--edge)" stroke-width="2"/>
      <circle class="lamp" cx="16" cy="25" r="9.5" fill="var(--done)"/>
    </svg>
    <div class="node-label">mow go</div>
  </div>`;
  if (plan.length) link(AX, START_Y, 17, plan[0].hubX, plan[0].hubY, R.hub, true);

  plan.forEach((p, wi) => {
    const w = p.w;
    const byId = new Map((w.lanes || []).map((l) => [String(l.lane), l]));

    (w.lanes || []).forEach((lane) => {
      const cx = lane._x, y = lane._y;
      const meta = `${lane.role || ""}${lane.afk === false ? " · fg" : " · afk"}`;
      const lStat = laneStats(lane);
      const laneTitle = `${lane.lane} — ${meta}${lStat ? " · " + lStat.text : ""}${lane.brief ? " · " + lane.brief : ""}`;
      nodes += compact
        ? circleNode(cx, y, R.lane, lane.status, "", laneTerseLabel(lane), laneTitle, lane.lane)
        : circleNode(cx, y, R.lane, lane.status, "", meta, `${lane.brief || ""}`, lane.lane, lStat);
      if (compact) return;                        /* letters only — skip the detail tree */

      const branchX = cx + 26;                      /* detail hangs below-right of the lane */
      let cy = y + R.lane + (lStat ? 54 : 40);

      /* todos — smallest unit of work, chained (sequential inside a lane) */
      const todos = lane.todos || [];
      if (todos.length) {
        line(cx, cy, branchX - R.todo, cy);
        todos.forEach((t, i) => {
          const tx = branchX + i * 30;
          nodes += `<div class="node s-${st(t.status)} small" style="left:${tx}px;top:${cy}px;width:${R.todo * 2}px;height:${R.todo * 2}px" title="${esc((t.id ? t.id + " " : "") + (t.title || ""))}">
            ${st(t.status) === "running" ? '<div class="bloom"></div><div class="ringx"></div>' : ""}<div class="disc"></div></div>`;
          if (i) line(tx - 30 + R.todo, cy, tx - R.todo, cy);
        });
        cy += 30;
      }

      /* agents in calling order; skills/tools/artifacts elbow off each agent */
      (lane.agents || []).forEach((a) => {
        line(cx, cy, branchX - R.agent, cy);
        /* how long this subagent ran, and what it spent — ticks live while running */
        const aTok = parseTokens(a.tokens);
        const aStat = statsLine(a.started, a.ended, aTok, a.status);
        /* an em dash where the writer never stamped the agent — same convention waves
           and lanes already use, so "not recorded" can't read as "nothing to report" */
        nodes += rowNode(branchX, cy, R.agent, a.status, a.name, "agent", a.detail, false,
          { text: aStat, started: a.started, ended: a.ended, tokens: aTok, status: a.status });
        const parentY = cy;
        cy += 36;
        const subs = [...(a.skills || []).map((s) => [s, "skill", R.skill]),
                      ...(a.tools || []).map((t) => [t, "tool", R.tool])];
        const subX = branchX + 32;
        subs.forEach(([s2, kind, r2]) => {
          edges += `<path d="M ${branchX} ${parentY + R.agent} L ${branchX} ${cy} L ${subX - r2} ${cy}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
          nodes += rowNode(subX, cy, r2, s2.status, s2.name, kind, s2.detail, true);
          cy += 30;
        });
        (a.artifacts || []).forEach((art) => {
          edges += `<path d="M ${branchX} ${parentY + R.agent} L ${branchX} ${cy} L ${subX - R.art} ${cy}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
          nodes += fileNode(subX, cy, art.status || a.status, art.label || art.path || "", art.path);
          cy += 30;
        });
      });

      /* findings — taskman rows */
      (lane.findings || []).forEach((f) => {
        const sev = esc(f.severity || "warning");
        nodes += `<div class="finding ${sev}" style="left:${branchX - 12}px;top:${cy}px" title="${esc(`${sev} ${f.task ? f.task + " " : ""}${f.title || ""}`)}">
          <b>${{ critical: "C", suggestion: "S" }[sev] || "W"}</b> <span class="tid">${esc(f.task || "")}</span> ${esc(f.title || "")}</div>`;
        cy += 22;
      });

      maxBottom = Math.max(maxBottom, cy);
    });

    /* fork — the hub opens into every lane of the first stage, all at once */
    (p.stages[0] || []).forEach((lane) => link(p.hubX, p.hubY, R.hub, lane._x, lane._y, R.lane));

    /* join — a later stage waits on the lanes it declared (or on the whole stage before it) */
    p.stages.forEach((stage, s) => {
      if (!s) return;
      stage.forEach((lane) => {
        const deps = (lane.after || []).map((d) => byId.get(String(d))).filter(Boolean);
        (deps.length ? deps : p.stages[s - 1]).forEach((d) => link(d._x, d._y, R.lane, lane._x, lane._y, R.lane));
      });
    });

    /* the wave's last stage rejoins at the gate, which hands the run to the next wave */
    const sinks = p.stages[p.stages.length - 1] || [];
    const next = plan[wi + 1];
    if (w.gate) {
      const gs = st(w.gate.status);
      const word = { pending: "gate", running: "reviewing", done: "passed",
                     issues: "issues", error: "failed" }[gs];
      nodes += circleNode(p.gateX, BASE_Y, R.gate, gs, "", word, "review gate");
      sinks.forEach((l) => link(l._x, l._y, R.lane, p.gateX, BASE_Y, R.gate));
      if (next) link(p.gateX, BASE_Y, R.gate, next.hubX, next.hubY, R.hub, true);
    } else if (next) {
      sinks.forEach((l) => link(l._x, l._y, R.lane, next.hubX, next.hubY, R.hub, true));
    }

    /* the hub, top-left of the plate — wave number, then its shape and cost beside it */
    const par = isParallel(w);
    const tok = waveTokens(w);
    /* start time under the number; once the wave has finished, its end time too */
    const hubTitle = `wave ${w.wave}${w.started ? " — started " + w.started : ""}${w.ended ? ", ended " + w.ended : ""}`;
    nodes += VIEW === "compact"
      ? circleNode(p.hubX, p.hubY, R.hub, w.status, "hub", "", hubTitle, `W${w.wave}`)
      : circleNode(p.hubX, p.hubY, R.hub, w.status, "hub",
          w.started ? `start: ${fmtClock(w.started)}` : "", hubTitle,
          w.wave, w.ended ? `end: ${fmtClock(w.ended)}` : null);
    if (!compact) axisLabels += `<div class="wave-head" style="left:${p.hubX + R.hub + 14}px;top:${p.hubY}px">
      <div class="mode${par ? "" : " is-seq"}"><span class="sym">${par ? "‖" : "→"}</span>${par ? "parallel" : "sequential"}</div>
      <div class="formula">${esc(laneFormula(w) || "—")}</div>
      <div class="head-stats stats" data-started="${esc(w.started || "")}" data-ended="${esc(w.ended || "")}"
        data-tokens="${tok == null ? "" : tok}" data-status="${esc(st(w.status))}"
        data-spans="${esc(spansAttr(w))}" title="${esc(statsTitle(w.started, w.ended, w.status, spansUnder(w)))}"
        >${esc(statsLine(w.started, w.ended, tok, w.status, spansUnder(w)))}</div>
    </div>`;
  });

  const bw = x + 60;
  const bh = maxBottom + 60;

  return `
    <div class="viewport">
      <div class="board panels-${PANEL_STYLE}" style="width:${bw}px;height:${bh}px">
        <svg width="${bw}" height="${bh}" viewBox="0 0 ${bw} ${bh}">
          <defs>
            <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--edge)"/></marker>
            <marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--ink)"/></marker>
          </defs>
          ${panels}${edges}
        </svg>
        ${axisLabels}${nodes}
      </div>
    </div>`;
}

/* one run's title line — stem, status dot, duration · tokens */
function runHead(data, heading) {
  const updated = data.updated ? new Date(data.updated) : null;
  const runTok = (data.waves || []).reduce((n, w) => n + (waveTokens(w) || 0), 0);
  const anyTok = (data.waves || []).some((w) => waveTokens(w) != null);
  const running = data.run_status === "running";
  const runEnd = running ? null : data.updated, runStatus = running ? "running" : "done";
  /* the headline is where the overnight number did its damage, so it is the one
     place the word is spelled out — a bare "41m" beside a 1:02 AM start invites
     exactly the arithmetic that produced 12h 51m */
  const runSpans = spansUnder(data), runActive = unionMs(runSpans);
  const runDur = runActive != null ? `${fmtDur(runActive)} active`
    : fmtDur(durationMs(data.started, runEnd, runStatus));
  const runStats = [runDur, anyTok ? fmtTokens(runTok) : null].filter(Boolean).join(" · ");
  const runTitle = statsTitle(data.started, runEnd, runStatus, runSpans);
  return `<${heading} class="run-title">
      <span class="dot s-${st(running ? "running" : data.run_status === "shipped" ? "done" : data.run_status)}"></span>
      ${esc(data.title || data.stem || "mow run")}
      <span class="stem">${esc(data.stem || "")}</span>
      <span class="run-stats" title="${esc(runTitle)}">${updated ? updated.toLocaleTimeString() : ""}${runStats ? " · " + esc(runStats) : ""}</span>
    </${heading}>`;
}

/* segmented pickers: both choices always visible, the active one filled — so the
   label never has to double as both the current state and the action */
function seg(label, name, options, current) {
  return `<span class="seg">${label}${options.map(([val, text]) =>
    `<button type="button" data-${name}="${val}"${val === current ? ' class="on"' : ""}>${text}</button>`).join("")}</span>`;
}

function controls(data, multi) {
  return `<span class="meta">
      ${multi ? seg("runs", "runs", [["live", "live"], ["archive", "archive"], ["all", "all"]], RUNS_MODE) : ""}
      ${seg("view", "view", [["detailed", "detailed"], ["compact", "compact"]], VIEW)}
      ${seg("waves", "panels", [["chip", "buttons"], ["tint", "tinted"]], PANEL_STYLE)}
      ${seg("pulse", "pulse", [["1", "on"], ["0", "off"]], pulseOn(data) ? "1" : "0")}
      <span class="live-dot"></span><span id="livetxt">live</span>
    </span>`;
}

function legend(data) {
  return `<footer class="legend">
      <span class="key"><span class="sw" style="background:var(--done)"></span>done</span>
      <span class="key"><span class="sw shine"></span>in progress</span>
      <span class="key"><span class="sw" style="background:var(--issues)"></span>passed with issues</span>
      <span class="key"><span class="sw" style="background:var(--error)"></span>failed</span>
      <span class="key"><b class="sev critical">C</b>critical finding</span>
      <span class="key"><b class="sev warning">W</b>warning</span>
      <span class="key"><b class="sev suggestion">S</b>suggestion</span>
      <span class="key">‖ lanes forked off one hub run together</span>
      <span class="key">→ a lane that waits, then rejoins at the gate</span>
      <span class="key"><span class="node file small" style="position:relative;width:16px;height:16px"><span class="disc" style="--node-fill:var(--done)">${fileIcon("a.py")}</span></span>artifact / file</span>
      <span class="key"><span class="node small" style="position:relative;width:16px;height:16px"><span class="disc" style="background:var(--pending)">${ICONS.agent}</span></span>agent</span>
      <span class="key"><span class="node small" style="position:relative;width:16px;height:16px"><span class="disc" style="background:var(--pending)">${ICONS.skill}</span></span>skill</span>
      <span class="key"><span class="node small" style="position:relative;width:16px;height:16px"><span class="disc" style="background:var(--pending)">${ICONS.tool}</span></span>tool call</span>
    </footer>`;
}

/* one run — the normal tracker */
function render(data) {
  applyPulse(data);
  SPAN_CEIL = spanCeiling(data);
  app.innerHTML = `<header class="top">${runHead(data, "h1")}${controls(data)}</header>`
    + boardMarkup(data) + legend(data);
  refreshDurations();
}

/* several runs on one page — every /mow go this server can see */
function renderMulti(runs) {
  const first = runs.length ? runs[0].data : {};
  applyPulse(first);
  const live = runs.filter((r) => r.data.run_status === "running").length;
  const head = `<header class="top">
      <h1>mow runs</h1>
      <span class="stem">${runs.length} run${runs.length === 1 ? "" : "s"}${live ? ` · ${live} live` : ""}</span>
      ${controls(first, true)}
    </header>`;
  /* an empty filter keeps its header: otherwise the switch that walked you into
     an empty archive is the one control the page no longer offers */
  if (!runs.length) {
    app.innerHTML = head + `<div class="empty"><p>${esc(EMPTY[RUNS_MODE] || EMPTY.all)}</p></div>`;
    return;
  }
  app.innerHTML = head
    + runs.map((r) => {
      SPAN_CEIL = spanCeiling(r.data);          /* each run capped by its own last write */
      ACTIVITY = r.activity || [];              /* and measured against its own trail */
      return `<section class="run">${runHead(r.data, "h2")}${boardMarkup(r.data)}</section>`;
    }).join("")
    + legend(first);
  refreshDurations();
}

function renderEmpty(msg) {
  app.innerHTML = `<div class="empty"><p>${msg}</p><p>tracker.json is written by the /mow go orchestrator next to this file.</p></div>`;
}

/* The page polls every 2s, but the board only changes when the orchestrator
   writes tracker.json. A run that is "running" whose file hasn't been touched
   in minutes means the writer is behind — say so, rather than letting a stale
   board read as live progress. */
const STALE_AFTER_MS = 240000;
let lastChangeAt = Date.now();       /* when the board's content last actually changed */

function markFresh(datas) {
  const dot = document.querySelector(".live-dot");
  const txt = document.getElementById("livetxt");
  if (!dot || !txt) return;
  dot.classList.remove("stale");
  const running = datas.filter((d) => d && d.run_status === "running");
  const ages = running.map((d) => Date.parse(d.updated)).filter(Number.isFinite).map((t) => Date.now() - t);
  const stamped = ages.length ? Math.max(...ages) : null;
  /* Two independent signals: the self-reported `updated` field, and content we
     actually watched change. Trust whichever is younger — an orchestrator that
     writes real progress but forgets to bump `updated` is still making progress,
     and a board is only truly behind when neither has moved. */
  const observed = Date.now() - lastChangeAt;
  const worst = stamped == null ? observed : Math.min(stamped, observed);
  if (running.length && worst > STALE_AFTER_MS) {
    dot.classList.add("stale");
    txt.textContent = `board ${fmtDur(worst)} behind`;
    txt.title = "the run is still going; the orchestrator hasn't written tracker.json since then";
  } else {
    txt.textContent = "live";
    txt.title = "";
  }
}

function refreshDurations() {
  document.querySelectorAll(".stats[data-started]").forEach((el) => {
    const started = el.getAttribute("data-started") || "";
    const ended = el.getAttribute("data-ended") || "";
    const raw = el.getAttribute("data-tokens");
    const tokens = raw === "" || raw == null ? null : +raw;
    const status = el.getAttribute("data-status");
    /* open spans resolve against this tick's now, so active time climbs only
       while an agent is actually running — and holds the moment the last one ends */
    const spans = parseSpans(el.getAttribute("data-spans"), Date.now());
    el.textContent = statsLine(started, ended, Number.isFinite(tokens) ? tokens : null, status, spans);
    const title = statsTitle(started, ended, status, spans);
    if (title) el.title = title;
  });
}

/* the trail sits beside the board in the same served folder; absent is normal */
async function fetchActivity(dir) {
  try {
    const r = await fetch(`${dir}${ACTIVITY_FILE}`, { cache: "no-store" });
    if (!r.ok) return [];
    const txt = await r.text();
    return activityWindows(txt.split("\n").map((n) => +n * 1000));
  } catch { return []; }
}

async function fetchRun(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* Sweeping the folder is the expensive half of a poll: a plans root carries a
   directory per plan and most have no dispatch/tracker.json at all, so probing
   every one of them every 2s is dozens of requests and a console full of 404s
   that hides real ones. Sweep on the first poll and every SWEEP_MS after; in
   between, re-poll only the stems that answered. A run that starts inside the
   window joins the board at the next sweep. */
const SWEEP_MS = 30000;
let sweptAt = 0;
let knownStems = null;

async function stemsToPoll() {
  if (knownStems && Date.now() - sweptAt < SWEEP_MS) return knownStems;
  sweptAt = Date.now();
  knownStems = null;
  return await discoverStems();
}

/* sibling runs, when this page is served from docs/plans/ */
async function discoverStems() {
  const html = await (await fetch("./", { cache: "no-store" })).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  return [...doc.querySelectorAll("a[href]")]
    .map((a) => a.getAttribute("href"))
    .filter((h) => h && h.endsWith("/") && !h.startsWith("/") && !h.startsWith("?") && !h.startsWith("."))
    .map((h) => decodeURIComponent(h.replace(/\/$/, "")));
}

async function pollMulti() {
  /* a named stem list is taken as given; live/archive/all sweep the folder */
  const filter = KEEP[RUNS_MODE];
  const named = filter ? await stemsToPoll()
    : RUNS_MODE.split(",").map((s) => s.trim()).filter(Boolean);
  const runs = [], found = [];
  for (const stem of named) {
    try {
      const data = await fetchRun(`${stem}/dispatch/tracker.json`);
      found.push(stem);                       /* has a tracker, whatever the filter says */
      if (filter && !filter(data)) continue;
      runs.push({ stem, data, activity: await fetchActivity(`${stem}/dispatch/`) });
    } catch { /* not a mow run, or its tracker isn't written yet */ }
  }
  if (filter) knownStems = found;
  if (!runs.length) {
    lastOk = Date.now();                      /* an empty filter is a poll that worked */
    if (lastPayload !== "[]") { lastPayload = "[]"; lastRuns = []; renderMulti([]); }
    markFresh([]);
    return;
  }
  const rank = (r) => (r.data.run_status === "running" ? 0 : 1);
  runs.sort((a, b) => rank(a) - rank(b) || String(b.data.started || "").localeCompare(String(a.data.started || "")));
  lastOk = Date.now();
  const payload = JSON.stringify(runs.map((r) => { const { pulse, ...rest } = r.data; return rest; }));
  if (payload === lastPayload) { markFresh(runs.map((r) => r.data)); return; }
  lastPayload = payload;
  lastChangeAt = Date.now();
  lastRuns = runs;
  renderMulti(runs);
  markFresh(runs.map((r) => r.data));
}

async function poll() {
  try {
    if (RUNS_MODE != null) return await pollMulti();
    const res = await fetch("tracker.json", { cache: "no-store" });
    /* no tracker.json beside the page means this is the repo's plans root and
       not one run's dispatch folder — so the bare board URL lands on live */
    if (res.status === 404) { RUNS_MODE = "live"; return await pollMulti(); }
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    ACTIVITY = await fetchActivity("");
    lastOk = Date.now();
    lastData = data;
    applyPulse(data);
    const { pulse, ...rest } = data;
    const payload = JSON.stringify(rest);
    if (payload === lastPayload) {
      markFresh([data]);
      return;
    }
    lastPayload = payload;
    lastChangeAt = Date.now();
    lastRuns = null;
    render(data);
    markFresh([data]);
  } catch {
    if (!lastOk) renderEmpty("Waiting for the run to start…");
    else {
      document.querySelector(".live-dot")?.classList.add("stale");
      const t = document.getElementById("livetxt"); if (t) t.textContent = "stale";
    }
  }
}

poll();
setInterval(poll, POLL_MS);
setInterval(refreshDurations, 1000);
</script>
</body>
</html>
