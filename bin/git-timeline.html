<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --line: #e4e4e0; --text: #1d1d1b; --muted: #6b6b66;
  --read: #8a94a6; --write: #2a78d6; --remote: #1baf7a; --destructive: #d03b3b; --fail: #d03b3b;
  --ok: #2e8b57; --accent: #1d1d1b; --chip: #efefeb;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Farro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1d1d1b; --line: #33332f; --text: #ecece8; --muted: #9a9a93;
    --read: #7d8697; --write: #3987e5; --remote: #199e70; --destructive: #d03b3b; --fail: #ef6a5c;
    --ok: #5fbf88; --accent: #ecece8; --chip: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --line: #33332f; --text: #ecece8; --muted: #9a9a93;
  --read: #7d8697; --write: #3987e5; --remote: #199e70; --destructive: #d03b3b; --fail: #ef6a5c;
  --ok: #5fbf88; --accent: #ecece8; --chip: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.repos { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button { font: inherit; color: inherit; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 11px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip.cat[aria-pressed="false"] { opacity: .45; }
.sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.controls { margin: 4px 0 14px; }
input[type=search] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.textbtn { border: 0; background: none; text-decoration: underline; cursor: pointer; padding: 0; color: var(--text); font-size: 12px; }
.chip.sm { padding: 2px 9px; font-size: 12px; }
.jsvg { display: block; }
.jgrid { stroke: var(--line); stroke-width: 1; }
.jaxis { fill: var(--muted); font-size: 10.5px; }
.jl { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.jl.main { stroke: var(--text); stroke-width: 3; }
.jl.ghost { stroke-dasharray: 4 3; }
.jc { fill: var(--write); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.jc.merge { fill: var(--surface); stroke: var(--text); }
.jc:hover { stroke: var(--text); }
.pr.merged { fill: var(--muted); }
.pr.open { fill: var(--muted); opacity: .55; }
.pr.closed { fill: none; stroke: var(--muted); stroke-dasharray: 2 2; }
.wt { fill: var(--chip); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.mk { stroke: var(--surface); stroke-width: 1.5; }
.mk.push { fill: var(--remote); }
.mk.destructive { fill: var(--destructive); }
.jlab { fill: var(--muted); font-size: 10.5px; }
.jlab.main { fill: var(--text); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.day { margin-bottom: 18px; }
.top { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start; }
.top > .card { margin-bottom: 14px; }
.dayhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 0 0 8px; }
.dayhead h3 { margin: 0; font-size: 15px; }
.dayhead h2 { margin: 0; }
.lanes { display: grid; grid-template-columns: 150px 1fr; row-gap: 4px; column-gap: 10px; align-items: center; }
.axis { position: relative; height: 16px; color: var(--muted); font-size: 11px; }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.lab { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip { position: relative; height: 18px; border-radius: 4px; background:
  repeating-linear-gradient(90deg, transparent 0 calc(var(--tick) - 1px), var(--line) calc(var(--tick) - 1px) var(--tick)), var(--chip); }
.dot { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
  border: 0; padding: 0; cursor: pointer; }
.dot.failed { background: transparent !important; box-shadow: inset 0 0 0 2.5px var(--fail); }
.dot.destructive { border-radius: 1px; transform: rotate(45deg); }
.dot:hover, .dot:focus-visible { transform: scale(1.6); z-index: 2; outline: none; }
.dot.destructive:hover, .dot.destructive:focus-visible { transform: rotate(45deg) scale(1.6); }
.ops { margin-top: 10px; border-top: 1px solid var(--line); }
.op { display: grid; grid-template-columns: 64px 78px 96px minmax(0, 1fr) 120px 60px; gap: 10px; padding: 5px 2px;
  border-bottom: 1px solid var(--line); align-items: baseline; font-size: 13px; }
.op.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--chip); } to { background: transparent; } }
.op time, .op .ses, .op .br { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.op .br { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op.head { color: var(--muted); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; padding: 7px 2px; }
.badge { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 5px; color: #fff; justify-self: start; }
.badge.read, .badge.remote { color: #0b0b0b; }
.argv { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.argv small { display: block; color: var(--muted); font-family: var(--sans); }
.st { font-size: 12px; white-space: nowrap; text-align: right; }
.st.bad { color: var(--fail); font-weight: 600; }
.more { margin-top: 8px; }
.linkbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
@media (max-width: 900px) { .top { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .lanes { grid-template-columns: 1fr; row-gap: 2px; }
  .lanes .lab { margin-top: 4px; }
  .lanes .axis-lab { display: none; }
  .op { grid-template-columns: 52px 1fr auto; }
  .op .ses, .op .br, .op.head { display: none; }
  .op .argv { grid-column: 1 / -1; order: 5; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Git timeline</h1>
  <div class="sub" id="meta"></div>
  <div class="repos" id="repos" role="toolbar" aria-label="Repository"></div>
  <div class="stats" id="stats"></div>
  <div class="row controls">
    <div class="row" id="cats"></div>
    <button class="chip" id="failed" aria-pressed="false">Failed only</button>
    <input type="search" id="q" placeholder="Filter: push, main, a commit message…" aria-label="Filter operations">
  </div>
  <div class="top">
    <div class="card">
      <div class="dayhead"><h2>Journey</h2><div class="row" id="zoom" role="toolbar" aria-label="Time span"></div></div>
      <div id="journey"></div>
      <div class="legend" id="jlegend"></div>
    </div>
    <div class="card" id="lanecard"></div>
  </div>
  <div id="days"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const CATS = [["read", "Read"], ["write", "Local write"], ["remote", "Remote"], ["destructive", "Destructive"]];
const CAT_VAR = c => `var(--${c})`;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pad = n => String(n).padStart(2, "0");
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hms = t => { const d = new Date(t); return `${hm(t)}:${pad(d.getSeconds())}`; };
const fmtDay = k => new Date(k + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const shortSes = s => (s || "unknown").slice(0, 8);

const ROWS = (DATA && DATA.rows || []).map((r, i) => Object.assign(r, { _i: i, _t: Date.parse(r.ts), _d: dayKey(Date.parse(r.ts)),
  _hay: [r.sub, r.argv, r.cmd, r.branch, r.worktree, r.error, r.session].filter(Boolean).join(" ").toLowerCase() }));
const REPOS = Object.entries(ROWS.reduce((m, r) => (m[r.repo] = (m[r.repo] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);

function load(k, d) { try { const v = localStorage.getItem("gt:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("gt:" + k, JSON.stringify(v)); } catch (e) {} }

const repoFromHash = () => { const h = decodeURIComponent((location.hash.match(/repo=([^&]+)/) || [])[1] || ""); return REPOS.some(([r]) => r === h) ? h : null; };
const S = {
  repo: repoFromHash() || (DATA && DATA.defaultRepo) || (REPOS[0] || [])[0],
  cats: new Set(load("cats", CATS.map(c => c[0]))), failed: false, q: "", day: null, shown: 5,
  zoom: ["24h", "7d", "30d", "All"].includes(load("zoom", "7d")) ? load("zoom", "7d") : "7d",
};

function base() { return ROWS.filter(r => r.repo === S.repo && S.cats.has(r.cat) && (!S.failed || r.ok === false)
  && (!S.q || r._hay.includes(S.q))); }

function renderRepos() {
  const box = $("repos"); box.replaceChildren();
  for (const [name, n] of REPOS) {
    const b = el("button", "chip"); b.setAttribute("aria-pressed", String(name === S.repo));
    b.append(el("span", null, name), el("span", "n", n.toLocaleString()));
    b.onclick = () => { S.repo = name; S.day = null; S.shown = 5; history.replaceState(null, "", "#repo=" + encodeURIComponent(name)); render(); };
    box.append(b);
  }
}

function renderCats() {
  const box = $("cats"); box.replaceChildren();
  const all = ROWS.filter(r => r.repo === S.repo);
  for (const [c, label] of CATS) {
    const b = el("button", "chip cat"); b.setAttribute("aria-pressed", String(S.cats.has(c)));
    const sw = el("span", "sw"); sw.style.background = CAT_VAR(c);
    b.append(sw, el("span", null, label), el("span", "n", all.filter(r => r.cat === c).length.toLocaleString()));
    b.onclick = () => { S.cats.has(c) ? S.cats.delete(c) : S.cats.add(c); save("cats", [...S.cats]); render(); };
    box.append(b);
  }
  $("failed").setAttribute("aria-pressed", String(S.failed));
}

function renderStats(rows) {
  const box = $("stats"); box.replaceChildren();
  const sessions = new Set(rows.map(r => r.session)).size;
  const tiles = [["Git ops", rows.length], ["Sessions", sessions], ["Commits", rows.filter(r => r.sub === "commit").length],
    ["Pushes", rows.filter(r => r.sub === "push").length], ["Failed", rows.filter(r => r.ok === false).length],
    ["Destructive", rows.filter(r => r.cat === "destructive").length]];
  for (const [label, n] of tiles) { const t = el("div", "stat"); t.append(el("b", null, n.toLocaleString()), el("span", null, label)); box.append(t); }
}

// <journey-layout> — pure functions; hooks/tests/test_git_ops.py runs them through node.
const MERGED_NAME = [/^Merge pull request #\d+ from [^/\s]+\/(\S+)/, /^Merge (?:remote-tracking )?branch '(?:origin\/)?([^']+)'/];

// Commits -> chains: one first-parent run per branch. main is the first-parent line from the
// default branch; every other tip, then every merge's side parent, claims what is left.
// PRs, worktrees and op marks hang off the chain whose name they carry, or get a dashed lane.
function chainsOf(g, wts, marks, now) {
  const C = new Map(), refTip = new Map(), mergeOf = new Map();
  for (const [sha, parents, t, refs, s] of g.commits) {
    const c = { sha, parents, t: t * 1000, refs: refs.filter(r => !r.startsWith("tag: ")), s, chain: null };
    C.set(sha, c);
    for (const r of c.refs) if (!refTip.has(r)) refTip.set(r, sha);
  }
  for (const c of C.values()) for (const p of c.parents.slice(1)) if (!mergeOf.has(p)) mergeOf.set(p, c);
  const prByHead = new Map(), prByMerge = new Map();
  for (const pr of g.prs || []) {
    pr._t0 = Date.parse(pr.created);
    pr._t1 = pr.merged ? Date.parse(pr.merged) : pr.closed ? Date.parse(pr.closed) : null;
    if (!prByHead.has(pr.head)) prByHead.set(pr.head, []);
    prByHead.get(pr.head).push(pr);
    if (pr.mergeOid) prByMerge.set(pr.mergeOid, pr);
  }
  const chains = [], byName = new Map();
  const add = ch => { Object.assign(ch, { id: chains.length, prs: [], wts: [], marks: [] }); chains.push(ch);
    if (!byName.has(ch.name)) byName.set(ch.name, ch); return ch; };
  const walk = (tip, name, kind) => {
    const commits = [];
    for (let c = C.get(tip); c && !c.chain; c = C.get(c.parents[0])) commits.push(c);
    if (!commits.length) return;
    commits.reverse();
    const fork = C.get(commits[0].parents[0]) || null, merge = mergeOf.get(commits[commits.length - 1].sha) || null;
    const same = byName.get(name);
    if (same && fork && same.commits[same.commits.length - 1] === fork) {   // origin/x ahead of x: one line
      commits.forEach(c => c.chain = same); same.commits.push(...commits); same.merge = merge || same.merge; return;
    }
    const ch = add({ name, kind, commits, fork, merge });
    commits.forEach(c => c.chain = ch);
  };
  const def = g.default;
  if (def) walk(refTip.get(def) || refTip.get("origin/" + def), def, "main");
  const refs = [...refTip.keys()].sort((a, b) => a.startsWith("origin/") - b.startsWith("origin/"));
  for (const r of refs) walk(refTip.get(r), r.replace(/^origin\//, ""), "branch");
  for (let grew = true; grew;) {
    grew = false;
    for (const c of C.values()) for (const p of c.parents.slice(1)) {
      if (!C.has(p) || C.get(p).chain) continue;
      const pr = prByMerge.get(c.sha), m = MERGED_NAME.map(re => c.s.match(re)).find(Boolean);
      let name = pr ? pr.head : m ? m[1] : "merged branch";
      // "Merge branch 'main' into x", then x fast-forwarded into main: main's own commits sit on the side.
      if (name === def) name = `${def} (merged into ${(c.s.match(/ into (\S+)$/) || [])[1] || "a local branch"})`;
      walk(p, name, "merged");
      grew = true;
    }
  }
  for (const c of C.values()) if (!c.chain) walk(c.sha, "detached", "branch");
  const main = chains.find(c => c.kind === "main") || chains[0];
  if (main) main.kind = "main";
  const named = name => { const c = byName.get(name); return c && c !== main ? c : null; };
  for (const pr of g.prs || []) {
    if (pr.head === def) continue;
    const ch = named(pr.head) || add({ name: pr.head, kind: "pr", commits: [], fork: null,
      merge: pr.mergeOid ? C.get(pr.mergeOid) || null : null, base: pr.base });
    ch.prs.push(pr);
  }
  const wtChain = n => chains.find(c => c !== main && (c.name === n || c.name === "worktree-" + n || c.name.endsWith("/" + n)));
  for (const w of wts) {
    const ch = (w.branch && named(w.branch)) || wtChain(w.name) || add({ name: w.branch || w.name, kind: "worktree", commits: [], fork: null, merge: null });
    ch.wts.push(w);
  }
  for (const m of marks) {
    const ch = (m.worktree && wtChain(m.worktree)) || (m.branch && named(m.branch)) || main;
    if (ch) ch.marks.push(m);
  }
  for (const ch of chains) {
    const ts = [];
    if (ch.fork) ts.push(ch.fork.t);
    for (const c of ch.commits) ts.push(c.t);
    if (ch.merge) ts.push(ch.merge.t);
    for (const pr of ch.prs) ts.push(pr._t0, pr._t1 ?? now);
    for (const w of ch.wts) ts.push(w.t0, w.t1);
    for (const m of ch.marks) ts.push(m.t);
    ch.t0 = Math.min(...ts); ch.t1 = Math.max(...ts);
  }
  return { chains, main };
}

// Lanes for the chains visible in [t0, t1]: main owns lane 0, the rest pack greedily by start time.
// Chains with commits in view pack first, so they sit next to main; long-open idle PRs sink below.
function packLanes(chains, t0, t1) {
  const gap = (t1 - t0) * 0.012, ends = [Infinity];
  const vis = chains.filter(c => c.kind === "main" || (c.t1 >= t0 && c.t0 <= t1));
  const idle = c => !c.commits.some(k => k.t >= t0 && k.t <= t1);
  for (const c of chains) c.lane = undefined;
  for (const c of vis) if (c.kind === "main") c.lane = 0;
  for (const c of vis.filter(c => c.kind !== "main").sort((a, b) => idle(a) - idle(b) || a.t0 - b.t0)) {
    let i = ends.findIndex((e, k) => k > 0 && e + gap < c.t0);
    if (i < 0) { i = ends.length; ends.push(0); }
    ends[i] = c.t1; c.lane = i;
  }
  return { vis, lanes: ends.length };
}
// </journey-layout>

const GRAPHS = (DATA && DATA.graphs) || {};
const SPANS = [["24h", 864e5], ["7d", 7 * 864e5], ["30d", 30 * 864e5], ["All", Infinity]];
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const tip = (e, text) => { sv("title", {}, e).textContent = text; return e; };
const when = t => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const JCACHE = {};

function journeyFor(repo) {
  if (JCACHE[repo]) return JCACHE[repo];
  const rows = ROWS.filter(r => r.repo === repo), wt = {};
  for (const r of rows) if (r.worktree) {
    const w = wt[r.worktree] ||= { name: r.worktree, t0: r._t, t1: r._t, n: 0, br: {} };
    w.t0 = Math.min(w.t0, r._t); w.t1 = Math.max(w.t1, r._t); w.n++;
    if (r.branch) w.br[r.branch] = (w.br[r.branch] || 0) + 1;
  }
  const wts = Object.values(wt).map(w => ({ ...w, branch: Object.entries(w.br).sort((a, b) => b[1] - a[1])[0]?.[0] || null }));
  const marks = rows.filter(r => r.sub === "push" || r.cat === "destructive")
    .map(r => ({ t: r._t, kind: r.cat === "destructive" ? "destructive" : "push", branch: r.branch, worktree: r.worktree, argv: r.argv, ok: r.ok }));
  return (JCACHE[repo] = chainsOf(GRAPHS[repo], wts, marks, Date.now()));
}

function renderZoom() {
  const box = $("zoom"); box.replaceChildren();
  for (const [k] of SPANS) {
    const b = el("button", "chip sm", k); b.setAttribute("aria-pressed", String(S.zoom === k));
    b.onclick = () => { S.zoom = k; save("zoom", k); renderZoom(); renderJourney(); };
    box.append(b);
  }
}

function renderLegend() {
  const box = $("jlegend");
  const item = (label, draw) => { const s = el("span"), g = sv("svg", { width: 22, height: 12, "aria-hidden": "true" }); draw(g); s.append(g, label); box.append(s); };
  item("main", g => sv("path", { d: "M1 6H21", class: "jl main" }, g));
  item("branch", g => sv("path", { d: "M1 6H21", class: "jl" }, g));
  item("commit", g => sv("circle", { cx: 11, cy: 6, r: 4, class: "jc" }, g));
  item("merge commit", g => sv("circle", { cx: 11, cy: 6, r: 4, class: "jc merge" }, g));
  item("PR (#n ✓ merged · open · ✕ closed)", g => sv("rect", { x: 1, y: 5, width: 20, height: 3, class: "pr merged" }, g));
  item("PR branch gone (squash-merged)", g => sv("path", { d: "M1 6H21", class: "jl ghost" }, g));
  item("worktree in use", g => sv("rect", { x: 1, y: 1, width: 20, height: 10, rx: 3, class: "wt" }, g));
  item("push", g => sv("path", { d: "M11 1L16 10H6Z", class: "mk push" }, g));
  item("destructive op", g => sv("path", { d: "M11 1L16 6L11 11L6 6Z", class: "mk destructive" }, g));
}

function renderJourney() {
  const host = $("journey"); host.replaceChildren();
  const g = GRAPHS[S.repo];
  if (!g || !g.commits.length) { host.append(el("div", "empty", "No commit history for this repo — its folder has moved, or it is not a git repo.")); return; }
  const J = journeyFor(S.repo);
  const tStart = Math.min(...J.chains.map(c => c.t0)), tEnd = Math.max(...J.chains.map(c => c.t1));
  const span = SPANS.find(s => s[0] === S.zoom)[1];
  let t0 = Math.max(tStart, tEnd - span), t1 = tEnd;
  if (t1 - t0 < 36e5) { t0 = t1 - 36e5; }
  const padT = (t1 - t0) * 0.03; t0 -= padT; t1 += padT;
  const { vis, lanes } = packLanes(J.chains, t0, t1);
  const nVis = vis.reduce((n, c) => n + c.commits.filter(k => k.t >= t0 && k.t <= t1).length, 0);
  const LH = 28, TOP = 22, padL = 10, padR = 14;
  const W = host.clientWidth || 600, H = TOP + lanes * LH + 4;   // fit, never scroll: a scrolled-off start hides every label
  const x = t => padL + (t - t0) / (t1 - t0) * (W - padL - padR), y = l => TOP + l * LH + LH / 2 + 2;
  const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: "jsvg", role: "img",
    "aria-label": `Branch journey of ${S.repo}: ${vis.length} branches, ${nVis} commits in view` });
  const clip = sv("clipPath", { id: "jclip" }, sv("defs", {}, svg));
  sv("rect", { x: padL - 8, y: 0, width: W - padL - padR + 16, height: H }, clip);
  // time axis
  const H1 = 36e5, D1 = 864e5, steps = [H1, 3 * H1, 6 * H1, 12 * H1, D1, 2 * D1, 7 * D1, 14 * D1, 30 * D1];
  const step = steps.find(s => s >= (t1 - t0) / Math.max(3, W / 110)) || 30 * D1;
  const ticks = [];
  if (step < D1) for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) ticks.push(t);
  else { const d = new Date(t0); d.setHours(24, 0, 0, 0); for (; d.getTime() < t1; d.setDate(d.getDate() + step / D1)) ticks.push(d.getTime()); }
  const short = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  for (const t of ticks) {
    sv("line", { x1: x(t), x2: x(t), y1: TOP - 4, y2: H, class: "jgrid" }, svg);
    const lab = step < D1 && new Date(t).getHours() !== 0 ? hm(t) : short(t);
    sv("text", { x: x(t), y: 12, "text-anchor": "middle", class: "jaxis" }, svg).textContent = lab;
  }
  const plot = sv("g", { "clip-path": "url(#jclip)" }, svg);
  const gBand = sv("g", {}, plot), gLine = sv("g", {}, plot), gDot = sv("g", {}, plot), gLab = sv("g", {}, plot);
  const curve = (xa, ya, xb, yb) => { const dx = Math.max(6, Math.min(26, (xb - xa) / 2));
    return `M${xa},${ya} C${xa + dx},${ya} ${xb - dx},${yb} ${xb},${yb}`; };
  const laneOf = c => c && c.chain && c.chain.lane;
  for (const ch of vis) {
    const Y = y(ch.lane), main = ch.kind === "main";
    for (const w of ch.wts) tip(sv("rect", { x: x(w.t0) - 4, y: Y - 11, width: Math.max(8, x(w.t1) - x(w.t0) + 8), height: 22, rx: 6, class: "wt" }, gBand),
      `worktree ${w.name}${w.branch ? ` on ${w.branch}` : ""}\n${w.n} git op(s), ${when(w.t0)} → ${when(w.t1)}`);
    const a = ch.commits.length ? ch.commits[0].t : ch.t0;
    const b = main ? tEnd : ch.commits.length ? ch.commits[ch.commits.length - 1].t : ch.t1;
    tip(sv("path", { d: `M${x(a)},${Y}H${x(b)}`, class: "jl" + (main ? " main" : "") + (ch.commits.length || main ? "" : " ghost") }, gLine),
      `${ch.name}${ch.commits.length ? ` — ${ch.commits.length} commit(s)` : ""}`);
    const fromLane = ch.fork ? laneOf(ch.fork) : (ch.kind === "pr" ? (J.chains.find(c => c.name === ch.base) || J.main).lane : undefined);
    if (fromLane !== undefined && !main) sv("path", { d: curve(ch.fork ? x(ch.fork.t) : x(a) - 18, y(fromLane), x(a), Y), class: "jl" + (ch.commits.length ? "" : " ghost") }, gLine);
    const mergedPr = ch.prs.find(p => p.merged);
    if (ch.merge && laneOf(ch.merge) !== undefined) sv("path", { d: curve(x(b), Y, x(ch.merge.t), y(laneOf(ch.merge))), class: "jl" + (ch.commits.length ? "" : " ghost") }, gLine);
    else if (!ch.commits.length && mergedPr && J.main && J.main.lane !== undefined) sv("path", { d: curve(x(b), Y, x(mergedPr._t1) + 18, y(0)), class: "jl ghost" }, gLine);
    for (const pr of ch.prs) {
      const e = pr._t1 ?? tEnd;
      tip(sv("rect", { x: x(pr._t0), y: Y + 6, width: Math.max(3, x(e) - x(pr._t0)), height: 3, rx: 1.5, class: "pr " + pr.state }, gLine),
        `#${pr.n} ${pr.title}\n${pr.head} → ${pr.base} · ${pr.state}\nopened ${when(pr._t0)}${pr._t1 ? ` · ${pr.state === "merged" ? "merged" : "closed"} ${when(pr._t1)}` : ""}`);
    }
    for (const c of ch.commits) {
      if (c.t < t0 - 864e5 || c.t > t1 + 864e5) continue;
      const dot = tip(sv("circle", { cx: x(c.t), cy: Y, r: 4, class: "jc" + (c.parents.length > 1 ? " merge" : "") }, gDot),
        `${c.sha.slice(0, 8)}  ${c.s}\n${when(c.t)}${c.refs.length ? "\n" + c.refs.join(", ") : ""}\n(click: show that day's sessions)`);
      dot.addEventListener("click", () => { S.day = dayKey(c.t); S.shown = 5; render(); });
    }
    for (const m of ch.marks) {
      const X = x(m.t), d = m.kind === "push" ? `M${X},${Y - 12}L${X + 4.5},${Y - 4}H${X - 4.5}Z` : `M${X},${Y - 13}L${X + 4.5},${Y - 8.5}L${X},${Y - 4}L${X - 4.5},${Y - 8.5}Z`;
      tip(sv("path", { d, class: "mk " + m.kind }, gDot), `${when(m.t)}  ${m.argv}${m.ok === false ? "  ✗ failed" : ""}`);
    }
    const prTag = ch.prs.map(p => `#${p.n}${p.state === "merged" ? " ✓" : p.state === "open" ? " open" : " ✕"}`).join(" ");
    const name = ch.name.length > 34 ? ch.name.slice(0, 33) + "…" : ch.name;
    const label = sv("text", { x: Math.max(x(a), padL) + 2, y: Y - 7, class: "jlab" + (main ? " main" : "") }, gLab);
    label.textContent = name + (prTag ? "  " + prTag : "");
    if (Math.max(x(a), padL) + 2 + label.textContent.length * 6 > W - padR) {   // would run off the right: hang it from the edge
      label.setAttribute("x", W - padR); label.setAttribute("text-anchor", "end");
    }
  }
  host.append(svg);
}

function opRow(r) {
  const row = el("div", "op"); row.id = "op-" + r._i;
  const badge = el("span", "badge " + r.cat, r.sub); badge.style.background = CAT_VAR(r.cat);
  const argv = el("div", "argv", r.argv);
  const ctx = [r.worktree && "worktree " + r.worktree, r.agent && "subagent " + r.agent.slice(0, 8)].filter(Boolean).join(" · ");
  if (ctx) argv.append(el("small", null, ctx));
  if (r.error) argv.append(el("small", null, r.error.split("\n").slice(0, 2).join(" — ")));
  const st = r.ok === false ? el("span", "st bad", "✗ failed") : r.ok ? el("span", "st", "✓") : el("span", "st", "?");
  if (r.ok == null) st.title = "exit status not recorded";
  const br = el("span", "br", r.branch || "—"); if (r.branch) br.title = r.branch;
  row.append(el("time", null, hms(r._t)), el("span", "ses", shortSes(r.session)), badge, argv, br, st);
  if (r.cmd) row.title = r.cmd;
  return row;
}

function opHead() {
  const h = el("div", "op head");
  for (const t of ["Time", "Session", "Op", "Command", "Branch", "Status"]) h.append(el("span", null, t));
  h.lastChild.style.textAlign = "right";
  return h;
}

// `laneBox`: where the swimlanes go. The focused day's lanes sit beside the chart; older days keep theirs inline.
function renderDay(k, list, laneBox) {
  const sec = el("section", "day card"), head = el("div", "dayhead");
  const sessions = [...new Set(list.map(r => r.session))];
  head.append(el("h3", null, fmtDay(k)), el("span", "sub", `${list.length} op(s) · ${sessions.length} session(s)`));
  if (!laneBox) sec.append(head);
  let t0 = list[0]._t, t1 = list[list.length - 1]._t;
  const MIN = 30 * 60e3; if (t1 - t0 < MIN) { const m = (t0 + t1) / 2; t0 = m - MIN / 2; t1 = m + MIN / 2; }
  const padT = (t1 - t0) * 0.02; t0 -= padT; t1 += padT;
  const x = t => ((t - t0) / (t1 - t0) * 100);
  const lanes = el("div", "lanes");
  const axis = el("div", "axis"), H = 3600e3;
  const step = (t1 - t0) > 8 * H ? 2 * H : (t1 - t0) > 3 * H ? H : (t1 - t0) > H ? 30 * 60e3 : 10 * 60e3;
  for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) { const s = el("span", null, hm(t)); s.style.left = x(t) + "%"; axis.append(s); }
  lanes.append(el("div", "lab axis-lab", ""), axis);
  const tick = (step / (t1 - t0) * 100) + "%";
  const ops = el("div", "ops"), LIMIT = 40;
  for (const s of sessions) {
    const mine = list.filter(r => r.session === s);
    const subs = new Set(mine.filter(r => r.agent).map(r => r.agent)).size;
    const lab = el("div", "lab", `${shortSes(s)} · ${mine.length}${subs ? ` · ${subs} sub` : ""}`);
    lab.title = `session ${s}` + (mine[0].worktree ? ` — worktree ${mine[0].worktree}` : "");
    const strip = el("div", "strip"); strip.style.setProperty("--tick", tick);
    for (const r of mine) {
      const d = el("button", "dot" + (r.ok === false ? " failed" : "") + (r.cat === "destructive" ? " destructive" : ""));
      d.style.left = x(r._t) + "%"; d.style.background = CAT_VAR(r.cat);
      d.setAttribute("aria-label", `${hm(r._t)} ${r.argv}`); d.title = `${hms(r._t)}  ${r.argv}${r.ok === false ? "  ✗ failed" : ""}`;
      d.onclick = () => { if (!document.getElementById("op-" + r._i)) { ops.replaceChildren(opHead(), ...[...list].reverse().map(opRow)); }
        const row = document.getElementById("op-" + r._i); row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
        row.scrollIntoView({ block: "center", behavior: "smooth" }); };
      strip.append(d);
    }
    lanes.append(lab, strip);
  }
  if (laneBox) {
    const h = el("div", "dayhead"), when = el("span", "sub", fmtDay(k) + (S.day ? " · " : ""));
    if (S.day) { const b = el("button", "textbtn", "back to latest"); b.onclick = () => { S.day = null; render(); }; when.append(b); }
    h.append(el("h2", null, "Session timeline"), when);
    laneBox.append(h, lanes);
    head.lastChild.textContent += " — timeline above";
    sec.append(head);
  } else sec.append(lanes);
  const newest = [...list].reverse();
  ops.append(opHead(), ...newest.slice(0, LIMIT).map(opRow));
  sec.append(ops);
  if (newest.length > LIMIT) {
    const more = el("div", "more"), b = el("button", "linkbtn", `Show all ${newest.length} ops`);
    b.onclick = () => { ops.replaceChildren(opHead(), ...newest.map(opRow)); more.remove(); };
    more.append(b); sec.append(more);
  }
  return sec;
}

function renderDays(rows) {
  const box = $("days"); box.replaceChildren();
  const laneCard = $("lanecard"); laneCard.replaceChildren();
  const by = {}; for (const r of rows) (by[r._d] ||= []).push(r);
  let keys = Object.keys(by).sort().reverse();
  if (S.day) keys = keys.filter(k => k === S.day);
  if (!keys.length) {
    const msg = el("div", "empty", S.day ? `No agent git ops on ${fmtDay(S.day)}. ` : "No sessions to show.");
    if (S.day) { const b = el("button", "textbtn", "back to latest"); b.onclick = () => { S.day = null; render(); }; msg.append(b); }
    laneCard.append(msg); box.append(el("div", "empty", ROWS.length ? "No git ops match these filters." : "No git ops logged yet — run `git-timeline backfill`.")); return; }
  keys.slice(0, S.shown).forEach((k, i) => box.append(renderDay(k, by[k], i === 0 ? laneCard : null)));
  if (keys.length > S.shown) {
    const b = el("button", "linkbtn", `Show older days (${keys.length - S.shown} more)`);
    b.onclick = () => { S.shown += 7; renderDays(rows); };
    box.append(b);
  }
}

function render() {
  renderRepos(); renderCats();
  const rows = base();
  renderStats(S.day ? rows.filter(r => r._d === S.day) : rows);
  renderJourney(); renderDays(rows);
  const all = ROWS.filter(r => r.repo === S.repo);
  $("meta").textContent = `${ROWS.length.toLocaleString()} git ops across ${REPOS.length} repos` +
    (all.length ? ` · ${S.repo}: ${fmtDay(all[0]._d)} → ${fmtDay(all[all.length - 1]._d)}` : "") +
    (DATA && DATA.generated ? ` · built ${new Date(DATA.generated).toLocaleString()}` : "");
}

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderJourney, 150); });
window.addEventListener("hashchange", () => { const r = repoFromHash(); if (r && r !== S.repo) { S.repo = r; S.day = null; S.shown = 5; render(); } });
$("failed").onclick = () => { S.failed = !S.failed; render(); };
let qt; $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); render(); }, 150); };
renderZoom(); renderLegend();
render();
</script>
</body>
</html>
