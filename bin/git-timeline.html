<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Farro:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --line: #e4e4e0; --text: #1d1d1b; --muted: #6b6b66;
  --read: #8a94a6; --write: #2a78d6; --remote: #1baf7a; --destructive: #d03b3b; --fail: #d03b3b;
  --ok: #2e8b57; --accent: #1d1d1b; --chip: #efefeb;
  --label: #1d1d1b;   /* label text: the text ink — white in dark mode, dark ink in light */
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Farro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1d1d1b; --line: #33332f; --text: #ecece8; --muted: #9a9a93;
    --read: #7d8697; --write: #3987e5; --remote: #199e70; --destructive: #d03b3b; --fail: #ef6a5c;
    --ok: #5fbf88; --accent: #ecece8; --chip: #2a2a27;
    --label: #ecece8;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --line: #33332f; --text: #ecece8; --muted: #9a9a93;
  --read: #7d8697; --write: #3987e5; --remote: #199e70; --destructive: #d03b3b; --fail: #ef6a5c;
  --ok: #5fbf88; --accent: #ecece8; --chip: #2a2a27;
  --label: #ecece8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
.guide { color: var(--label); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap;
  border: 1px solid var(--label); border-radius: 999px; padding: 5px 12px; }
.guide:hover, .guide:focus-visible { background: var(--label); color: var(--bg); outline: none; }
.pagefoot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; }
.sub { color: var(--label); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.repos { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button { font: inherit; color: inherit; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 11px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { color: var(--label); font-variant-numeric: tabular-nums; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip.cat[aria-pressed="false"] { opacity: .45; }
.sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 14px 0; }
.op .tk { color: var(--label); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.op.head > :nth-child(6) { text-align: right; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  text-align: left; cursor: pointer; font: inherit; color: var(--text); }
.stat:hover, .stat:focus-visible { border-color: var(--text); outline: none; }
.stat[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.tl-row { display: grid; gap: 10px; padding: 6px 2px; border: 0; border-bottom: 1px solid var(--line); background: none;
  font: inherit; color: var(--text); text-align: left; width: 100%; align-items: baseline; font-size: 13px; cursor: pointer; }
.tl-row:hover { background: var(--chip); }
.tl-ops { grid-template-columns: 124px minmax(0, 190px) 92px minmax(0, 1fr); }
.tl-ops .argv small { display: block; color: var(--label); font-family: var(--sans); }
.tl-ops .argv .err { color: var(--fail); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-ops .argv .after { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-chats { grid-template-columns: minmax(0, 1fr) 70px 70px 90px 80px 80px 150px; }
.tl-head { cursor: default; color: var(--label); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.tl-head:hover { background: none; }
.tl-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-row .m { color: var(--label); font-size: 12px; }
.tl-row .bad { color: var(--fail); font-weight: 700; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--label); font-size: 12px; }
.controls { margin: 4px 0 14px; }
input[type=search] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 13px; margin: 0 0 10px; color: var(--label); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.textbtn { border: 0; background: none; text-decoration: underline; cursor: pointer; padding: 0; color: var(--text); font-size: 12px; }
.chip.sm { padding: 2px 9px; font-size: 12px; }
.jsvg { display: block; }
.jgrid { stroke: var(--line); stroke-width: 1; }
.jaxis { fill: var(--label); font-size: 10.5px; }
.jl { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.jl.main { stroke: var(--text); stroke-width: 3; }
.jl.ghost { stroke-dasharray: 4 3; }
.jc { fill: var(--write); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.jc.merge { fill: var(--surface); stroke: var(--text); }
.jc:hover { stroke: var(--text); }
.pr.merged { fill: var(--muted); }
.pr.open { fill: var(--muted); opacity: .55; }
.pr.closed { fill: none; stroke: var(--muted); stroke-dasharray: 2 2; }
.wt { fill: var(--chip); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.mk { stroke: var(--surface); stroke-width: 1.5; }
.mk.push { fill: var(--remote); }
.mk.destructive { fill: var(--destructive); }
.jlab { fill: var(--label); font-size: 10.5px; }
.jlab.main { fill: var(--text); font-weight: 500; }
.sy-bar.push, .sy-bar.pull { fill: var(--remote); }
.sy-bar.pull { opacity: .6; }
.sy-bar { cursor: pointer; }
.sy-base { stroke: var(--muted); stroke-width: 1; }
.sy-fail { stroke: var(--destructive); stroke-width: 2; stroke-linecap: round; }
.ev { border-bottom: 1px solid var(--line); }
.evday { color: var(--label); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
  padding: 12px 2px 4px; border-bottom: 1px solid var(--line); }
.ev > summary { display: grid; grid-template-columns: 64px 74px minmax(0, 1fr) 150px 220px; gap: 10px; padding: 6px 2px;
  cursor: pointer; list-style: none; align-items: baseline; font-size: 13px; }
.ev > summary::-webkit-details-marker { display: none; }
.ev-head { display: grid; grid-template-columns: 64px 74px minmax(0, 1fr) 150px 220px; gap: 10px; padding: 7px 2px;
  color: var(--label); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--line); }
.ev > summary .m { color: var(--label); font-size: 12px; }
.ev > summary .by, .chat > summary .c2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.flash > summary { animation: flash 1.4s ease-out; }
.ev .dir { font-weight: 500; }
.ev .bad { color: var(--fail); }
.ev ol { margin: 0 0 8px; padding: 0 0 0 150px; list-style: none; font-size: 12.5px; }
.ev li { padding: 2px 0; display: flex; gap: 10px; }
.ev li .sha { color: var(--label); min-width: 64px; }
.chat > summary { grid-template-columns: minmax(0, 1fr) 90px 120px 150px 64px; }
.chat > summary .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat li .how { color: var(--label); font-size: 11.5px; white-space: nowrap; }
.chat li .pushed { margin-left: auto; color: var(--label); font-size: 11.5px; white-space: nowrap; }
.chat li .pushed.no { color: var(--text); }
.ev li .subj { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--label); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.day { margin-bottom: 18px; }
.top { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start; }
.top > .card { margin-bottom: 14px; }
.dayhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin: 0 0 8px; }
.dayhead h3 { margin: 0; font-size: 15px; }
.dayhead h2 { margin: 0; }
.lanes { display: grid; grid-template-columns: 150px 1fr; row-gap: 4px; column-gap: 10px; align-items: center; }
.axis { position: relative; height: 16px; color: var(--label); font-size: 11px; }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.lab { font-size: 12px; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip { position: relative; height: 18px; border-radius: 4px; background:
  repeating-linear-gradient(90deg, transparent 0 calc(var(--tick) - 1px), var(--line) calc(var(--tick) - 1px) var(--tick)), var(--chip); }
.dot { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
  border: 0; padding: 0; cursor: pointer; }
.dot.failed { background: transparent !important; box-shadow: inset 0 0 0 2.5px var(--fail); }
.dot.destructive { border-radius: 1px; transform: rotate(45deg); }
.dot:hover, .dot:focus-visible { transform: scale(1.6); z-index: 2; outline: none; }
.dot.destructive:hover, .dot.destructive:focus-visible { transform: rotate(45deg) scale(1.6); }
.ops { margin-top: 10px; border-top: 1px solid var(--line); }
.op { display: grid; grid-template-columns: 64px 78px 96px minmax(0, 1fr) 120px 64px 60px; gap: 10px; padding: 5px 2px;
  border-bottom: 1px solid var(--line); align-items: baseline; font-size: 13px; }
.op.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--chip); } to { background: transparent; } }
.op time, .op .ses, .op .br { color: var(--label); font-variant-numeric: tabular-nums; font-size: 12px; }
.op .br { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op.head { color: var(--label); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; padding: 7px 2px; }
.badge { font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 5px; color: #fff; justify-self: start; }
.badge.read, .badge.remote { color: #0b0b0b; }
.argv { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.argv small { display: block; color: var(--label); font-family: var(--sans); }
.st { font-size: 12px; white-space: nowrap; text-align: right; }
.st.bad { color: var(--fail); font-weight: 700; }
.more { margin-top: 8px; }
.linkbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.empty { color: var(--label); padding: 30px 0; text-align: center; }
@media (max-width: 900px) { .top { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .lanes { grid-template-columns: 1fr; row-gap: 2px; }
  .lanes .lab { margin-top: 4px; }
  .lanes .axis-lab { display: none; }
  .op { grid-template-columns: 52px 1fr auto; }
  .op .ses, .op .br, .op .tk, .op.head { display: none; }
  .tl-ops { grid-template-columns: 1fr auto; }
  .tl-ops .t, .tl-head { display: none; }
  .tl-ops .argv { grid-column: 1 / -1; }
  .tl-chats { grid-template-columns: 1fr auto auto; }
  .tl-chats > :nth-child(4), .tl-chats > :nth-child(5), .tl-chats > :nth-child(7) { display: none; }
  .ev > summary { grid-template-columns: 52px 1fr auto; }
  .ev > summary .ref, .ev > summary .by, .ev-head { display: none; }
  .ev ol { padding-left: 8px; }
  .chat > summary { grid-template-columns: 1fr auto; }
  .chat > summary .m, .chat > summary .c2 { display: none; }
  .ev li { flex-wrap: wrap; }
  .op .argv { grid-column: 1 / -1; order: 5; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="dayhead"><h1>Git timeline</h1><a class="guide" href="git-timeline-guide.html">How to read this page →</a></div>
  <div class="sub" id="meta"></div>
  <div class="repos" id="repos" role="toolbar" aria-label="Repository"></div>
  <div class="stats" id="stats"></div>
  <div class="card" id="tilelist" hidden></div>
  <div class="row controls">
    <div class="row" id="cats"></div>
    <button class="chip" id="failed" aria-pressed="false">Failed only</button>
    <input type="search" id="q" placeholder="Filter: push, main, a commit message…" aria-label="Filter operations">
  </div>
  <div class="top">
    <div class="card">
      <div class="dayhead"><h2>Journey</h2><div class="row" id="zoom" role="toolbar" aria-label="Time span"></div></div>
      <div id="journey"></div>
      <div class="legend" id="jlegend"></div>
    </div>
    <div class="card" id="lanecard"></div>
  </div>
  <div class="card" id="synccard">
    <div class="dayhead"><h2>Push &amp; pull</h2><span class="sub" id="syncsum"></span></div>
    <div id="syncchart"></div>
    <div id="synclist"></div>
  </div>
  <div class="card" id="chatcard">
    <div class="dayhead"><h2>Chats</h2><span class="sub" id="chatsum"></span></div>
    <div id="chatlist"></div>
  </div>
  <div id="days"></div>
  <div class="pagefoot"><a class="guide" href="git-timeline-guide.html">New to git, or to this page? Read the guide →</a></div>
</div>
<script>
let DATA = /*__DATA__*/null;
const LIVE = /*__LIVE__*/false;    // true when `git-timeline serve` hands out the page
const CATS = [["read", "Read"], ["write", "Local write"], ["remote", "Remote"], ["destructive", "Destructive"]];
const CAT_VAR = c => `var(--${c})`;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pad = n => String(n).padStart(2, "0");
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hms = t => { const d = new Date(t); return `${hm(t)}:${pad(d.getSeconds())}`; };
const fmtDay = k => new Date(k + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const shortSes = s => (s || "unknown").slice(0, 8);
let TITLES = {};
const chatName = s => (s && TITLES[s]) || shortSes(s);
// Estimated tokens a Bash call put into the chat: its output plus the command itself, ~4 characters
// a token. One call prints one output for all its git commands, so each row carries the call's total
// and sums use each row's even share. An estimate of context, not a bill.
const callTok = r => r.out_chars == null ? null : Math.round(((r.out_chars || 0) + (r.cmd_chars || 0)) / 4);
const shareTok = r => { const t = callTok(r); return t == null ? 0 : t / (r.calln || 1); };
const fmtTok = n => n == null ? "—" : n < 1000 ? `~${Math.round(n)}` : `~${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k`;
const tokTitle = r => r.out_chars == null ? "not measured (logged before sizes were recorded)" :
  `~${callTok(r).toLocaleString()} tokens: output ${r.out_chars.toLocaleString()} + command ${(r.cmd_chars || 0).toLocaleString()} characters, ÷ 4` +
  (r.calln > 1 ? `\none Bash call ran ${r.calln} commands and returned one output: ~${Math.round(shareTok(r)).toLocaleString()} each in totals` : "");

let ROWS = [], REPOS = [];

// Load a payload: the embedded one once, or a fresh one from data.json every refresh in live mode.
function ingest(d) {
  DATA = d; TITLES = d.titles || {}; GRAPHS = d.graphs || {};
  ROWS = (d.rows || []).map((r, i) => Object.assign(r, { _i: i, _t: Date.parse(r.ts), _d: dayKey(Date.parse(r.ts)),
    _hay: [r.sub, r.argv, r.cmd, r.branch, r.worktree, r.error, r.session].filter(Boolean).join(" ").toLowerCase() }));
  REPOS = Object.entries(ROWS.reduce((m, r) => (m[r.repo] = (m[r.repo] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
  for (const cache of [JCACHE, PUSHED, CHATCOMMITS]) for (const k in cache) delete cache[k];
}

function load(k, d) { try { const v = localStorage.getItem("gt:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("gt:" + k, JSON.stringify(v)); } catch (e) {} }

const repoFromHash = () => { const h = decodeURIComponent((location.hash.match(/repo=([^&]+)/) || [])[1] || ""); return REPOS.some(([r]) => r === h) ? h : null; };
const S = {
  repo: null,                       // set by start(), once the data is in
  cats: new Set(load("cats", CATS.map(c => c[0]))), failed: false, q: "", day: null, shown: 5,
  tile: null, expand: null,
  zoom: ["24h", "7d", "30d", "All"].includes(load("zoom", "7d")) ? load("zoom", "7d") : "7d",
};

function base() { return ROWS.filter(r => r.repo === S.repo && S.cats.has(r.cat) && (!S.failed || r.ok === false)
  && (!S.q || r._hay.includes(S.q))); }

function renderRepos() {
  const box = $("repos"); box.replaceChildren();
  for (const [name, n] of REPOS) {
    const b = el("button", "chip"); b.setAttribute("aria-pressed", String(name === S.repo));
    b.append(el("span", null, name), el("span", "n", n.toLocaleString()));
    b.onclick = () => { S.repo = name; S.day = null; S.shown = 5; history.replaceState(null, "", "#repo=" + encodeURIComponent(name)); render(); };
    box.append(b);
  }
}

function renderCats() {
  const box = $("cats"); box.replaceChildren();
  const all = ROWS.filter(r => r.repo === S.repo);
  for (const [c, label] of CATS) {
    const b = el("button", "chip cat"); b.setAttribute("aria-pressed", String(S.cats.has(c)));
    const sw = el("span", "sw"); sw.style.background = CAT_VAR(c);
    b.append(sw, el("span", null, label), el("span", "n", all.filter(r => r.cat === c).length.toLocaleString()));
    b.onclick = () => { S.cats.has(c) ? S.cats.delete(c) : S.cats.add(c); save("cats", [...S.cats]); render(); };
    box.append(b);
  }
  $("failed").setAttribute("aria-pressed", String(S.failed));
}

// Each tile is also a door: click it for the list behind the number.
const TILES = [["ops", "Git ops", "Every git op", r => true], ["sessions", "Sessions", "Chats", r => true],
  ["commits", "Commits", "Commits", r => r.sub === "commit"], ["pushes", "Pushes", "Pushes", r => r.sub === "push"],
  ["failed", "Failed", "Failed commands", r => r.ok === false], ["destructive", "Destructive", "Destructive commands", r => r.cat === "destructive"],
  ["tokens", "~Tokens", "Most expensive git ops", r => r.out_chars != null]];

function renderStats(rows) {
  const box = $("stats"); box.replaceChildren();
  for (const [key, label, , keep] of TILES) {
    const n = key === "sessions" ? new Set(rows.map(r => r.session)).size : rows.filter(keep).length;
    const t = el("button", "stat"); t.setAttribute("aria-pressed", String(S.tile === key));
    t.setAttribute("aria-controls", "tilelist");
    const shown = key === "tokens" ? fmtTok(rows.reduce((k, r) => k + shareTok(r), 0)) : n.toLocaleString();
    if (key === "tokens") t.title = "Estimated tokens the git ops in view put into their chats' context (output + command, ÷ 4)";
    t.append(el("b", null, shown), el("span", null, label));
    t.onclick = () => { S.tile = S.tile === key ? null : key; render();
      if (S.tile) $("tilelist").scrollIntoView({ block: "nearest", behavior: "smooth" }); };
    box.append(t);
  }
  renderTileList(rows);
}

// The commits each chat made in a repo, oldest first: [ms, sha, subject].
const CHATCOMMITS = {};
function chatCommits(repo, session) {
  const key = repo + "\u0000" + session;
  if (CHATCOMMITS[key]) return CHATCOMMITS[key];
  const g = GRAPHS[repo], A = (g && g.authors) || {};
  return (CHATCOMMITS[key] = ((g && g.commits) || []).filter(c => A[c[0]] && A[c[0]].s === session)
    .map(c => [c[2] * 1000, c[0], c[4]]).sort((a, b) => a[0] - b[0]));
}
// What a chat was working on when it ran `r`: its last commit in that repo before it.
function afterCommit(r) {
  let hit = null;
  for (const c of chatCommits(r.repo, r.session)) { if (c[0] <= r._t) hit = c; else break; }
  return hit;
}

// Jump from a list row to the command itself, in that day's table.
function jump(r) {
  S.day = r._d; S.expand = r._d; render();
  requestAnimationFrame(() => { const row = document.getElementById("op-" + r._i); if (!row) return;
    row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); row.scrollIntoView({ block: "center", behavior: "smooth" }); });
}

function renderTileList(rows) {
  const box = $("tilelist"); box.replaceChildren(); box.hidden = !S.tile;

}

function renderSync() {
  const chart = $("syncchart"), list = $("synclist"), sum = $("syncsum");
  chart.replaceChildren(); list.replaceChildren(); sum.textContent = "";
  const g = GRAPHS[S.repo];
  if (!g || !S.win) { list.append(el("div", "empty", "No remote history for this repo.")); return; }
  const [t0, t1] = S.win;
  const evs = (g.sync || []).filter(e => e.t * 1000 >= t0 && e.t * 1000 <= t1);
  const push = evs.filter(e => e.how === "push" && !e.failed), pull = evs.filter(e => e.how !== "push");
  const n = a => a.reduce((k, e) => k + e.n, 0), failed = evs.filter(e => e.failed).length;
  sum.textContent = `↑ ${push.length} push(es), ${n(push)} commit(s) · ↓ ${pull.length} fetch/pull(s), ${n(pull)} commit(s)` +
    (failed ? ` · ${failed} failed` : "") + " · in view";
  if (!evs.length) { list.append(el("div", "empty", "No pushes or pulls in this time span.")); return; }
  // Mirror chart: pushed commits rise above the line, pulled ones hang below. One axis, one unit.
  const W = chart.clientWidth || 600, TOP = 22, HALF = 46, H = TOP + HALF * 2 + 6, mid = TOP + HALF + 2;
  const padL = 10, padR = 14, x = t => padL + (t - t0) / (t1 - t0) * (W - padL - padR);
  const max = Math.max(1, ...evs.map(e => e.n)), h = k => Math.max(3, Math.sqrt(k / max) * (HALF - 4));
  const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: "jsvg", role: "img",
    "aria-label": `Pushes and pulls: ${n(push)} commits pushed, ${n(pull)} pulled` });
  timeAxis(svg, x, t0, t1, W, TOP, H);
  sv("line", { x1: padL, x2: W - padR, y1: mid, y2: mid, class: "sy-base" }, svg);
  sv("text", { x: padL, y: TOP + 10, class: "jaxis" }, svg).textContent = "↑ pushed";
  sv("text", { x: padL, y: H - 4, class: "jaxis" }, svg).textContent = "↓ pulled";
  evs.forEach((e, i) => {
    const X = x(e.t * 1000), tipText = `${when(e.t * 1000)}  ${syncLabel(e)} ${e.ref}\n` +
      (e.failed ? `failed: ${e.argv || ""}` : `${e.n} commit(s)${e.forced ? `, force — dropped ${e.dropped}` : ""} · ${who(e)}`);
    let mark;
    if (e.failed) {
      mark = sv("g", { class: "sy-bar" }, svg);
      sv("path", { d: `M${X - 4},${mid - 14}L${X + 4},${mid - 6}M${X + 4},${mid - 14}L${X - 4},${mid - 6}`, class: "sy-fail" }, mark);
      sv("rect", { x: X - 6, y: mid - 16, width: 12, height: 12, fill: "transparent" }, mark);
    } else {
      const hh = h(e.n), up = e.how === "push";
      mark = sv("rect", { x: X - 2.5, y: up ? mid - hh : mid, width: 5, height: hh, rx: 2, class: "sy-bar " + (up ? "push" : "pull") }, svg);
      if (e.forced) sv("path", { d: `M${X},${mid - hh - 11}L${X + 4.5},${mid - hh - 6.5}L${X},${mid - hh - 2}L${X - 4.5},${mid - hh - 6.5}Z`, class: "mk destructive" }, svg);
    }
    tip(mark, tipText + "\n(click: show its commits)");
    mark.addEventListener("click", () => { const d = document.getElementById("ev-" + i); if (!d) return;
      d.open = true; d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash"); d.scrollIntoView({ block: "center", behavior: "smooth" }); });
  });
  chart.append(svg);
  const LIMIT = 30, rows = evs.map((e, i) => {
    const d = el("details", "ev"); d.id = "ev-" + i;
    const sm = el("summary");
    const count = e.failed ? el("span", "bad", "✗ failed") :
      el("span", null, `${e.n} commit${e.n === 1 ? "" : "s"}${e.forced ? ` · force, dropped ${e.dropped}` : ""}`);
    const by = el("span", "m by", who(e)); by.title = who(e);
    sm.append(el("span", "m", hm(e.t * 1000)), el("span", "dir", syncLabel(e)), el("span", "ref", e.ref), count, by);
    d.append(sm);
    const ol = el("ol");
    if (e.failed) ol.append(el("li", null, e.error || e.argv || "push failed"));
    for (const [sha, subj] of e.commits) { const li = el("li"), a = (g.authors || {})[sha];
      li.append(el("span", "sha", sha.slice(0, 8)), el("span", "subj", subj), el("span", "how", madeBy(a))); ol.append(li); }
    if (e.n > e.commits.length) ol.append(el("li", "m", `… and ${e.n - e.commits.length} more`));
    if (e.old) { const li = el("li", "m"); li.append(el("span", "sha", "range"), el("span", null, `${e.old.slice(0, 8)}..${e.new.slice(0, 8)}`)); ol.append(li); }
    d.append(ol);
    return d;
  });
  const head = el("div", "ev-head");
  for (const t of ["Time", "Direction", "Branch", "Commits", "Chat"]) head.append(el("span", null, t));
  list.append(head);
  const days = {}; rows.forEach((r, i) => { (days[dayKey(evs[i].t * 1000)] ||= []).push(r); });
  let shown = 0;
  for (const [k, rs] of Object.entries(days)) {
    list.append(el("div", "evday", fmtDay(k)));
    for (const r of rs) { if (shown++ >= LIMIT) r.hidden = true; list.append(r); }
  }
  if (shown > LIMIT) {
    const b = el("button", "linkbtn more", `Show all ${shown} events`);
    b.onclick = () => { list.querySelectorAll("details[hidden]").forEach(d => d.hidden = false); b.remove(); };
    list.append(b);
  }
}


// Every chat that made or pushed a commit in view: what it made, and who pushed each of those.
function renderChats() {
  const list = $("chatlist"), sum = $("chatsum"); list.replaceChildren(); sum.textContent = "";
  const g = GRAPHS[S.repo];
  if (!g || !S.win) { list.append(el("div", "empty", "No commit history for this repo.")); return; }
  const [t0, t1] = S.win, A = g.authors || {}, OUT = "\u0000outside";
  const chats = {}, get = k => chats[k] ||= { made: [], pushes: 0, pushedN: 0, last: 0 };
  for (const [sha, , t, , subj, gh] of g.commits) {
    if (t * 1000 < t0 || t * 1000 > t1) continue;
    const a = A[sha], c = get(a ? a.s : OUT);
    c.made.push({ sha, t: t * 1000, subj, a, gh }); c.last = Math.max(c.last, t * 1000);
  }
  for (const e of g.sync || []) {
    if (e.how !== "push" || e.failed || e.t * 1000 < t0 || e.t * 1000 > t1) continue;
    const c = get(e.session || OUT); c.pushes++; c.pushedN += e.n; c.last = Math.max(c.last, e.t * 1000);
  }
  const keys = Object.keys(chats).sort((a, b) => (a === OUT) - (b === OUT) || chats[b].last - chats[a].last);
  const exact = Object.values(A).filter(a => a.how === "exact" || a.how === "message").length;
  sum.textContent = `${keys.filter(k => k !== OUT).length} chat(s) in view · ${exact} of ${Object.keys(A).length} attributed commits proven by sha or message`;
  if (!keys.length) { list.append(el("div", "empty", "No commits or pushes in this time span.")); return; }
  for (const k of keys) {
    const c = chats[k], d = el("details", "ev chat"), sm = el("summary");
    const title = el("span", "t", k === OUT ? "Outside agents (you, an IDE, GitHub)" : chatName(k));
    if (k !== OUT) title.title = `session ${k}`;
    sm.append(title, el("span", "m", k === OUT ? "" : shortSes(k)), el("span", null, `${c.made.length} commit${c.made.length === 1 ? "" : "s"} made`),
      el("span", "c2", `${c.pushes} push${c.pushes === 1 ? "" : "es"} · ${c.pushedN} commits`), el("span", "m", hm(c.last)));
    d.append(sm);
    const ol = el("ol");
    for (const m of c.made.sort((a, b) => b.t - a.t)) {
      const li = el("li"), p = pushedMap(S.repo)[m.sha];
      li.append(el("span", "sha", m.sha.slice(0, 8)), el("span", "subj", m.subj));
      if (m.a && m.a.how !== "exact") li.append(el("span", "how", m.a.how === "ambiguous" ? `ambiguous (+${m.a.alt})` : HOW[m.a.how]));
      if (m.gh) li.append(el("span", "how", "made on GitHub"));
      li.append(el("span", "pushed" + (p ? "" : " no"), p ? `pushed by ${p.session === k ? "this chat" : who(p)} · ${hm(p.t * 1000)}` : "not pushed"));
      ol.append(li);
    }
    if (!c.made.length) ol.append(el("li", "m", "Made no commits in view — only pushed others' work."));
    d.append(ol); list.append(d);
  }
}

function opRow(r) {
  const row = el("div", "op"); row.id = "op-" + r._i;
  const badge = el("span", "badge " + r.cat, r.sub); badge.style.background = CAT_VAR(r.cat);
  const argv = el("div", "argv", r.argv);
  const ctx = [r.worktree && "worktree " + r.worktree, r.agent && "subagent " + r.agent.slice(0, 8)].filter(Boolean).join(" · ");
  if (ctx) argv.append(el("small", null, ctx));
  if (r.error) argv.append(el("small", null, r.error.split("\n").slice(0, 2).join(" — ")));
  const st = r.ok === false ? el("span", "st bad", "✗ failed") : r.ok ? el("span", "st", "✓") : el("span", "st", "?");
  if (r.ok == null) st.title = "exit status not recorded";
  const br = el("span", "br", r.branch || "—"); if (r.branch) br.title = r.branch;
  const ses = el("span", "ses", shortSes(r.session)); ses.title = chatName(r.session);
  const tk = el("span", "tk", r.out_chars == null ? "—" : fmtTok(shareTok(r)) + (r.calln > 1 ? "*" : "")); tk.title = tokTitle(r);
  row.append(el("time", null, hms(r._t)), ses, badge, argv, br, tk, st);
  if (r.cmd) row.title = r.cmd;
  return row;
}

function opHead() {
  const h = el("div", "op head");
  for (const t of ["Time", "Session", "Op", "Command", "Branch", "~Tokens", "Status"]) h.append(el("span", null, t));
  h.lastChild.style.textAlign = "right";
  return h;
}

// `laneBox`: where the swimlanes go. The focused day's lanes sit beside the chart; older days keep theirs inline.
function renderDay(k, list, laneBox) {
  const sec = el("section", "day card"), head = el("div", "dayhead");
  const sessions = [...new Set(list.map(r => r.session))];
  head.append(el("h3", null, fmtDay(k)), el("span", "sub", `${list.length} op(s) · ${sessions.length} session(s)`));
  if (!laneBox) sec.append(head);
  let t0 = list[0]._t, t1 = list[list.length - 1]._t;
  const MIN = 30 * 60e3; if (t1 - t0 < MIN) { const m = (t0 + t1) / 2; t0 = m - MIN / 2; t1 = m + MIN / 2; }
  const padT = (t1 - t0) * 0.02; t0 -= padT; t1 += padT;
  const x = t => ((t - t0) / (t1 - t0) * 100);
  const lanes = el("div", "lanes");
  const axis = el("div", "axis"), H = 3600e3;
  const step = (t1 - t0) > 8 * H ? 2 * H : (t1 - t0) > 3 * H ? H : (t1 - t0) > H ? 30 * 60e3 : 10 * 60e3;
  for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) { const s = el("span", null, hm(t)); s.style.left = x(t) + "%"; axis.append(s); }
  lanes.append(el("div", "lab axis-lab", ""), axis);
  const tick = (step / (t1 - t0) * 100) + "%";
  const ops = el("div", "ops"), LIMIT = S.expand === k ? Infinity : 40;
  for (const s of sessions) {
    const mine = list.filter(r => r.session === s);
    const subs = new Set(mine.filter(r => r.agent).map(r => r.agent)).size;
    const lab = el("div", "lab", `${chatName(s)} · ${mine.length}${subs ? ` · ${subs} sub` : ""}`);
    lab.title = `${chatName(s)}\nsession ${s}` + (mine[0].worktree ? ` — worktree ${mine[0].worktree}` : "");
    const strip = el("div", "strip"); strip.style.setProperty("--tick", tick);
    for (const r of mine) {
      const d = el("button", "dot" + (r.ok === false ? " failed" : "") + (r.cat === "destructive" ? " destructive" : ""));
      d.style.left = x(r._t) + "%"; d.style.background = CAT_VAR(r.cat);
      d.setAttribute("aria-label", `${hm(r._t)} ${r.argv}`); d.title = `${hms(r._t)}  ${r.argv}${r.ok === false ? "  ✗ failed" : ""}`;
      d.onclick = () => { if (!document.getElementById("op-" + r._i)) { ops.replaceChildren(opHead(), ...[...list].reverse().map(opRow)); }
        const row = document.getElementById("op-" + r._i); row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
        row.scrollIntoView({ block: "center", behavior: "smooth" }); };
      strip.append(d);
    }
    lanes.append(lab, strip);
  }
  if (laneBox) {
    const h = el("div", "dayhead"), when = el("span", "sub", fmtDay(k) + (S.day ? " · " : ""));
    if (S.day) { const b = el("button", "textbtn", "back to latest"); b.onclick = () => { S.day = null; render(); }; when.append(b); }
    h.append(el("h2", null, "Session timeline"), when);
    laneBox.append(h, lanes);
    head.lastChild.textContent += " — timeline above";
    sec.append(head);
  } else sec.append(lanes);
  const newest = [...list].reverse();
  ops.append(opHead(), ...newest.slice(0, LIMIT).map(opRow));
  sec.append(ops);
  if (newest.length > LIMIT) {
    const more = el("div", "more"), b = el("button", "linkbtn", `Show all ${newest.length} ops`);
    b.onclick = () => { ops.replaceChildren(opHead(), ...newest.map(opRow)); more.remove(); };
    more.append(b); sec.append(more);
  }
  return sec;
}

function renderDays(rows) {
  const box = $("days"); box.replaceChildren();
  const laneCard = $("lanecard"); laneCard.replaceChildren();
  const by = {}; for (const r of rows) (by[r._d] ||= []).push(r);
  let keys = Object.keys(by).sort().reverse();
  if (S.day) keys = keys.filter(k => k === S.day);
  if (!keys.length) {
    const msg = el("div", "empty", S.day ? `No agent git ops on ${fmtDay(S.day)}. ` : "No sessions to show.");
    if (S.day) { const b = el("button", "textbtn", "back to latest"); b.onclick = () => { S.day = null; render(); }; msg.append(b); }
    laneCard.append(msg); box.append(el("div", "empty", ROWS.length ? "No git ops match these filters." : "No git ops logged yet — run `git-timeline backfill`.")); return; }
  keys.slice(0, S.shown).forEach((k, i) => box.append(renderDay(k, by[k], i === 0 ? laneCard : null)));
  if (keys.length > S.shown) {
    const b = el("button", "linkbtn", `Show older days (${keys.length - S.shown} more)`);
    b.onclick = () => { S.shown += 7; renderDays(rows); };
    box.append(b);
  }
}

function render() {
  renderRepos(); renderCats();
  const rows = base();
  renderStats(S.day ? rows.filter(r => r._d === S.day) : rows);
  renderJourney(); renderSync(); renderChats(); renderDays(rows);
  const all = ROWS.filter(r => r.repo === S.repo);
  $("meta").textContent = `${ROWS.length.toLocaleString()} git ops across ${REPOS.length} repos` +
    (all.length ? ` · ${S.repo}: ${fmtDay(all[0]._d)} → ${fmtDay(all[all.length - 1]._d)}` : "") +
    (DATA && DATA.generated ? (LIVE ? ` · live, updated ${new Date(DATA.generated).toLocaleTimeString()}` : ` · built ${new Date(DATA.generated).toLocaleString()}`) : "");
}

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderJourney(); renderSync(); renderChats(); }, 150); });
window.addEventListener("hashchange", () => { const r = repoFromHash(); if (r && r !== S.repo) { S.repo = r; S.day = null; S.shown = 5; render(); } });
$("failed").onclick = () => { S.failed = !S.failed; render(); };
let qt; $("q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); render(); }, 150); };
function start() {
  S.repo = repoFromHash() || DATA.defaultRepo || (REPOS[0] || [])[0];
  renderZoom(); renderLegend(); render();
}
if (DATA) { ingest(DATA); start(); }
else if (LIVE) {
  $("meta").textContent = "Loading live data… (the first load asks GitHub for pull requests and takes a few seconds)";
  // Live: pull data.json now and every 30 s. Repo, zoom, filters, open list and scroll survive a refresh.
  const pull = first => fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(d => {
    const y = window.scrollY;
    ingest(d);
    if (first) return start();
    if (!REPOS.some(([r]) => r === S.repo)) S.repo = (REPOS[0] || [])[0];
    render(); window.scrollTo(0, y);
  }).catch(() => { $("meta").textContent = "Live data unavailable: is `git-timeline serve` still running?"; });
  pull(true); setInterval(() => pull(false), 30000);
}
</script>
</body>
</html>
